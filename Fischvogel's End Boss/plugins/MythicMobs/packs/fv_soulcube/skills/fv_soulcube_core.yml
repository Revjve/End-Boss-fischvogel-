# ============================================================================
#  THE BLOCK  (fv_soulcube_block)
# ============================================================================
#  States (caster variable fv_soulcube_block, saved through restarts):
#     READY     sits on the ground, looks like a block, waits for a click
#     AWAKE     a fight is running - the block hides 3 blocks under its spot
#               so its hitbox can never soak up hits meant for the boss
#     COOLDOWN  the boss was killed; counts down, then re-forms
# ============================================================================

# Seconds until the block re-forms after the boss was killed.
# -1 = the boss can only be killed once (the block is removed for good).
fv_soulcube_block_settings:
  Skills:
  - setvariable{var=caster.fv_soulcube_respawn;type=INTEGER;value=300;save=true}

fv_soulcube_block_spawn:
  Skills:
  - skill{s=fv_soulcube_block_settings} @self
  - setvariable{var=caster.fv_soulcube_block;type=STRING;value=READY;save=true}
  - setvariable{var=caster.fv_soulcube_hidden;type=INTEGER;value=0;save=true}
  - skill{s=fv_soulcube_snap_yaw} @self
  - skill{s=fv_soulcube_block_model} @self

# The dormant look: on_spawn's very first frame, frozen - the closed block
# exactly as it looks the moment it starts to wake (every bone pinned, the
# light rays not out yet). Lit by the world like a normal block; it only
# starts to glow once it wakes up.
# ModelEngine plays "default states" on its own (idle while standing still,
# walk while moving, ...). Here they are pointed at "dormant" too, so nothing
# can ever make the block move.
fv_soulcube_block_model:
  Skills:
  - model{mid=fv_soulcube;usm=true;hitbox=false;lockpitch=true;damagetint=false;showshadow=false;radius=64;initrender=false} @self
  - defaultstate{mid=fv_soulcube;type=IDLE;state=dormant;li=0;lo=0} @self
  - defaultstate{mid=fv_soulcube;type=WALK;state=dormant;li=0;lo=0} @self
  - bodyrotation{mid=fv_soulcube;playermode=false;mh=0;mb=0;stable=0;rdelay=0;rduration=0} @self
  - state{mid=fv_soulcube;s=dormant;p=10;li=0;lo=0;force=true} @self
  - renderinit{mid=fv_soulcube} @self

# Blocks only come in four directions - turn to the nearest one.
fv_soulcube_snap_yaw:
  Skills:
  - setvariable{var=skill.yaw;type=FLOAT;value="((<caster.l.yaw>)%360+360)%360"}
  - setrotation{yaw=0;pitch=0} @self ?variableinrange{var=skill.yaw;value=0to45}
  - setrotation{yaw=90;pitch=0} @self ?variableinrange{var=skill.yaw;value=45to135}
  - setrotation{yaw=180;pitch=0} @self ?variableinrange{var=skill.yaw;value=135to225}
  - setrotation{yaw=270;pitch=0} @self ?variableinrange{var=skill.yaw;value=225to315}
  - setrotation{yaw=0;pitch=0} @self ?variableinrange{var=skill.yaw;value=315to360}

fv_soulcube_block_load:
  Skills:
  - skill{s=fv_soulcube_block_settings} @self
  # READY: just make sure the model is on
  - skill{s=fv_soulcube_block_model} @self ?variableequals{var=caster.fv_soulcube_block;value=READY}
  # a fight was running when the chunk unloaded / the server stopped
  - skill{s=fv_soulcube_block_restore} @self ?variableequals{var=caster.fv_soulcube_block;value=AWAKE}
  # killed: keep counting down (the timer below handles it)
  - skill{s=fv_soulcube_noop} @self ?variableequals{var=caster.fv_soulcube_block;value=COOLDOWN}
  # unknown (variables lost) - treat it as ready
  - skill{s=fv_soulcube_block_restore} @self ?!variableisset{var=caster.fv_soulcube_block}

fv_soulcube_block_hit:
  Skills:
  - cancelevent
  - skill{s=fv_soulcube_block_wake} @self

fv_soulcube_block_click:
  Skills:
  - cancelevent
  - skill{s=fv_soulcube_block_wake} @self

fv_soulcube_block_wake:
  Conditions:
  - variableequals{var=caster.fv_soulcube_block;value=READY} true
  Skills:
  - setvariable{var=caster.fv_soulcube_block;type=STRING;value=AWAKE;save=true}
  # covers the time until the boss sends its first heartbeat
  - setvariable{var=caster.fv_soulcube_boss_alive;type=INTEGER;value=1;duration=100}
  # the boss appears in exactly this spot and rotation and starts on_spawn
  # from its first frame - the block simply turns into it
  - summon{type=fv_soulcube;amount=1;radius=0;sio=true;sip=true} @SelfLocation
  # 2 ticks of overlap so the boss model is on screen before this one goes
  - delay 2
  - model{mid=fv_soulcube;remove=true} @self
  - teleport{unsafe=true;preserveyaw=true} @SelfLocation{y=-3}
  - setvariable{var=caster.fv_soulcube_hidden;type=INTEGER;value=1;save=true}

fv_soulcube_block_second:
  Skills:
  - skill{s=fv_soulcube_block_ambience} @self ?variableequals{var=caster.fv_soulcube_block;value=READY}
  # the boss vanished without reporting back (chunk unload etc.)
  - skill{s=fv_soulcube_block_restore} @self ?variableequals{var=caster.fv_soulcube_block;value=AWAKE} ?!variableisset{var=caster.fv_soulcube_boss_alive}
  - skill{s=fv_soulcube_block_countdown} @self ?variableequals{var=caster.fv_soulcube_block;value=COOLDOWN}

fv_soulcube_block_on_defeat:
  Skills:
  - skill{s=fv_soulcube_block_settings} @self
  - setvariable{var=caster.fv_soulcube_cd;type=INTEGER;value=<caster.var.fv_soulcube_respawn>;save=true}
  - setvariable{var=caster.fv_soulcube_block;type=STRING;value=COOLDOWN;save=true}
  - remove @self ?variableinrange{var=caster.fv_soulcube_respawn;value=-99999to-1}

fv_soulcube_block_countdown:
  Skills:
  - variableadd{var=caster.fv_soulcube_cd;amount=-1}
  - skill{s=fv_soulcube_block_restore} @self ?variableinrange{var=caster.fv_soulcube_cd;value=-99999to0}

# Back on the ground, model on, ready for the next fight.
fv_soulcube_block_restore:
  Skills:
  - teleport{unsafe=true;preserveyaw=true} @SelfLocation{y=3} ?variableequals{var=caster.fv_soulcube_hidden;value=1}
  - setvariable{var=caster.fv_soulcube_hidden;type=INTEGER;value=0;save=true}
  - setvariable{var=caster.fv_soulcube_block;type=STRING;value=READY;save=true}
  - skill{s=fv_soulcube_block_model} @self
  - skill{s=fv_soulcube_sfx_block_reform} @self

# Runs every second while the block waits.
fv_soulcube_block_ambience:
  Skills:
  - skill{s=fv_soulcube_sfx_block_heartbeat} @self ?playerwithin{d=14}
  - randomskill{skills=fv_soulcube_sfx_block_whisper,fv_soulcube_noop,fv_soulcube_noop} @self ?playerwithin{d=9}
  - randomskill{skills=fv_soulcube_block_peek,fv_soulcube_noop,fv_soulcube_noop,fv_soulcube_noop} @self ?playerwithin{d=7}

# It opens its eye and blinks at you ("eyes" animation), then goes still.
# "eyes" keys exactly the same bones as "dormant", so the two are swapped
# outright (no blending) - never stacked.
fv_soulcube_block_peek:
  Cooldown: 7
  Skills:
  - state{mid=fv_soulcube;s=dormant;p=10;r=true;i=true} @self
  - state{mid=fv_soulcube;s=eyes;p=10;li=0;lo=0;force=true} @self
  - skill{s=fv_soulcube_sfx_block_peek} @self
  # eyes is 29 ticks long and ends on the open eye - switch back one tick
  # early so the model is never left without an animation
  - delay 28
  - skill{s=fv_soulcube_block_peek_end} @self ?variableequals{var=caster.fv_soulcube_block;value=READY}

fv_soulcube_block_peek_end:
  Skills:
  - state{mid=fv_soulcube;s=eyes;p=10;r=true;i=true} @self
  - state{mid=fv_soulcube;s=dormant;p=10;li=0;lo=0;force=true} @self

fv_soulcube_noop:
  Skills:
  - setvariable{var=skill.noop;type=INTEGER;value=0}


# ============================================================================
#  BOSS SETTINGS
# ============================================================================
#  fv_soulcube_arena_r  radius (blocks) of the open, flat floor around the block.
#                 The down beam never leaves it: past this distance the
#                 boss turns back towards its block. Set it to your arena's
#                 radius minus 2. Between attacks it also blinks back home if
#                 it ever ends up more than 24 blocks away.
fv_soulcube_boss_settings:
  Skills:
  - setvariable{var=caster.fv_soulcube_arena_r;type=FLOAT;value=18}


# ============================================================================
#  THE BOSS - spawn and wake-up  (on_spawn, 140 ticks at 100% speed)
# ============================================================================
#    0   light rays burst out of the block
#   17   it starts to tremble
#   51   lifts off (rises 30 px = 1.875 blocks in the animation)
#   81   the frame strains
#  117   violent shaking
#  119   the eye opens
#  123   the frame bursts open           -> shockwave pushes players back
#  139   hand-over to idle (one tick before on_spawn would loop)
#  The whole time it cannot be damaged.
# ============================================================================
fv_soulcube_boss_spawn:
  Skills:
  - setvariable{var=caster.fv_soulcube_state;type=STRING;value=WAKING}
  - setvariable{var=caster.fv_soulcube_mode;type=STRING;value=IMMUNE}
  - setvariable{var=caster.fv_soulcube_busy;type=INTEGER;value=1}
  - setvariable{var=caster.fv_soulcube_hpx;type=INTEGER;value=0}
  - setvariable{var=caster.fv_soulcube_hpx_target;type=INTEGER;value=0}
  - setvariable{var=caster.fv_soulcube_lasttype;type=STRING;value=NONE}
  - setvariable{var=caster.fv_soulcube_phasebreak;type=INTEGER;value=0}
  - setvariable{var=caster.fv_soulcube_alone;type=INTEGER;value=0}
  - setvariable{var=caster.fv_soulcube_alive;type=INTEGER;value=1;duration=400}
  - setvarloc{var=caster.fv_soulcube_home;val=@SelfLocation}
  - setvariable{var=caster.fv_soulcube_home_x;type=FLOAT;value=<caster.l.x.double>}
  - setvariable{var=caster.fv_soulcube_home_z;type=FLOAT;value=<caster.l.z.double>}
  - skill{s=fv_soulcube_phase_1} @self
  - skill{s=fv_soulcube_boss_settings} @self
  - model{mid=fv_soulcube;usm=true;hitbox=false;lockpitch=true;damagetint=true;showshadow=true;radius=64;initrender=false} @self
  # ModelEngine's own default states (idle while standing still, walk while
  # moving, death when it dies) all point at the empty "blank" animation:
  # only the states these skills choose ever move the model
  - defaultstate{mid=fv_soulcube;type=IDLE;state=blank;li=0;lo=0} @self
  - defaultstate{mid=fv_soulcube;type=WALK;state=blank;li=0;lo=0} @self
  - defaultstate{mid=fv_soulcube;type=DEATH;state=blank;li=0;lo=0} @self
  # the model always faces exactly where the boss faces - the laser's hit
  # detection relies on this (0 degree head/body clamps, no delay)
  - bodyrotation{mid=fv_soulcube;playermode=false;mh=0;mb=0;stable=0;rdelay=0;rduration=0} @self
  - brightness{mid=fv_soulcube;b=15;s=15} @self
  - state{mid=fv_soulcube;s=on_spawn;p=10;li=0;lo=6;force=true} @self
  - renderinit{mid=fv_soulcube} @self
  - skill{s=fv_soulcube_wake_timeline} @self

fv_soulcube_wake_timeline:
  Skills:
  - skill{s=fv_soulcube_sfx_wake_burst} @self
  - delay 17
  - skill{s=fv_soulcube_sfx_wake_tremble} @self
  - delay 34
  - skill{s=fv_soulcube_sfx_wake_lift} @self
  - delay 30
  - skill{s=fv_soulcube_sfx_wake_strain} @self
  - delay 36
  - skill{s=fv_soulcube_sfx_wake_shake} @self
  - delay 2
  - skill{s=fv_soulcube_sfx_wake_eye} @self
  - delay 4
  - skill{s=fv_soulcube_sfx_wake_frame} @self
  - skill{s=fv_soulcube_wake_shockwave} @self
  - delay 16
  - skill{s=fv_soulcube_wake_handover} @self

# on_spawn ends with the cube 30 px up in the air while idle starts at 0 px.
# Both animations blend over 6 ticks while the boss itself climbs 30 px in
# 6 equal steps, so the cube stays exactly where it is on screen.
fv_soulcube_wake_handover:
  Skills:
  - state{mid=fv_soulcube;s=on_spawn;p=10;r=true} @self
  - state{mid=fv_soulcube;s=idle;p=10;li=6;lo=6;force=true} @self
  - teleport{unsafe=true;preserveyaw=true} @SelfLocation{y=0.3125}
  - delay 1
  - teleport{unsafe=true;preserveyaw=true} @SelfLocation{y=0.3125}
  - delay 1
  - teleport{unsafe=true;preserveyaw=true} @SelfLocation{y=0.3125}
  - delay 1
  - teleport{unsafe=true;preserveyaw=true} @SelfLocation{y=0.3125}
  - delay 1
  - teleport{unsafe=true;preserveyaw=true} @SelfLocation{y=0.3125}
  - delay 1
  - teleport{unsafe=true;preserveyaw=true} @SelfLocation{y=0.3125}
  - setvariable{var=caster.fv_soulcube_hpx;type=INTEGER;value=30}
  - delay 2
  - setvariable{var=caster.fv_soulcube_state;type=STRING;value=FIGHT}
  - setvariable{var=caster.fv_soulcube_mode;type=STRING;value=OPEN}
  # settle down to the normal hover height (16 px)
  - skill{s=fv_soulcube_height_to_idle} @self
  - skill{s=fv_soulcube_loop} @self


# ============================================================================
#  FIGHT LOOP
# ============================================================================
fv_soulcube_loop:
  Conditions:
  - variableequals{var=caster.fv_soulcube_state;value=FIGHT} true
  Skills:
  - setvariable{var=caster.fv_soulcube_busy;type=INTEGER;value=0}
  - setvariable{var=caster.fv_soulcube_mode;type=STRING;value=OPEN}
  - setvariable{var=caster.fv_soulcube_wait;type=INTEGER;value="<caster.var.fv_soulcube_t_idle>+floor(random(0,<caster.var.fv_soulcube_t_idle_rand>))"}
  - setvariable{var=caster.fv_soulcube_alive;type=INTEGER;value=1;duration=200}
  - delay{ticks=<caster.var.fv_soulcube_wait>}
  - skill{s=fv_soulcube_pick} @self

fv_soulcube_pick:
  Conditions:
  - variableequals{var=caster.fv_soulcube_state;value=FIGHT} true
  Skills:
  - setvariable{var=caster.fv_soulcube_busy;type=INTEGER;value=1}
  - setvariable{var=caster.fv_soulcube_alive;type=INTEGER;value=1;duration=440}
  # dragged too far from its block? blink back first
  - setvariable{var=skill.away;type=FLOAT;value="sqrt(((<caster.l.x.double>)-(<caster.var.fv_soulcube_home_x>))^2+((<caster.l.z.double>)-(<caster.var.fv_soulcube_home_z>))^2)"}
  - skill{s=fv_soulcube_return_home} @self ?variableinrange{var=skill.away;value=24to99999}
  - skill{s=fv_soulcube_pick_p1} @self ?variableequals{var=caster.fv_soulcube_phase;value=1}
  - skill{s=fv_soulcube_pick_p2} @self ?variableequals{var=caster.fv_soulcube_phase;value=2}
  - skill{s=fv_soulcube_pick_p3} @self ?variableequals{var=caster.fv_soulcube_phase;value=3}

# Never the same attack TYPE twice in a row. The last type is copied into a
# skill variable first, because the attack that starts on one line already
# changes fv_soulcube_lasttype before the next line is checked.
fv_soulcube_pick_p1:
  Skills:
  - setvariable{var=skill.last;type=STRING;value=<caster.var.fv_soulcube_lasttype>}
  - randomskill{skills=fv_soulcube_type_downbeam,fv_soulcube_type_shoot_p1} @self ?variableequals{var=skill.last;value=LASER}
  - randomskill{skills=fv_soulcube_type_laser_p1,fv_soulcube_type_shoot_p1} @self ?variableequals{var=skill.last;value=DOWNBEAM}
  - randomskill{skills=fv_soulcube_type_laser_p1,fv_soulcube_type_downbeam} @self ?variableequals{var=skill.last;value=SHOOT}
  - randomskill{skills=fv_soulcube_type_laser_p1,fv_soulcube_type_downbeam,fv_soulcube_type_shoot_p1} @self ?variableequals{var=skill.last;value=NONE}

fv_soulcube_pick_p2:
  Skills:
  - setvariable{var=skill.last;type=STRING;value=<caster.var.fv_soulcube_lasttype>}
  - randomskill{skills=fv_soulcube_type_downbeam,fv_soulcube_type_shoot_p2} @self ?variableequals{var=skill.last;value=LASER}
  - randomskill{skills=fv_soulcube_type_laser_p2,fv_soulcube_type_shoot_p2} @self ?variableequals{var=skill.last;value=DOWNBEAM}
  - randomskill{skills=fv_soulcube_type_laser_p2,fv_soulcube_type_downbeam} @self ?variableequals{var=skill.last;value=SHOOT}
  - randomskill{skills=fv_soulcube_type_laser_p2,fv_soulcube_type_downbeam,fv_soulcube_type_shoot_p2} @self ?variableequals{var=skill.last;value=NONE}

fv_soulcube_pick_p3:
  Skills:
  - setvariable{var=skill.last;type=STRING;value=<caster.var.fv_soulcube_lasttype>}
  - randomskill{skills=fv_soulcube_type_downbeam,fv_soulcube_type_shoot_p3} @self ?variableequals{var=skill.last;value=LASER}
  - randomskill{skills=fv_soulcube_type_laser_p3,fv_soulcube_type_shoot_p3} @self ?variableequals{var=skill.last;value=DOWNBEAM}
  - randomskill{skills=fv_soulcube_type_laser_p3,fv_soulcube_type_downbeam} @self ?variableequals{var=skill.last;value=SHOOT}
  - randomskill{skills=fv_soulcube_type_laser_p3,fv_soulcube_type_downbeam,fv_soulcube_type_shoot_p3} @self ?variableequals{var=skill.last;value=NONE}

# ---- which patterns each phase may use ----------------------------------
fv_soulcube_type_laser_p1:
  Skills:
  - randomskill{skills=fv_soulcube_laser_straight,fv_soulcube_laser_jumprope} @self
fv_soulcube_type_shoot_p1:
  Skills:
  - randomskill{skills=fv_soulcube_shoot_aimed,fv_soulcube_shoot_ring} @self

fv_soulcube_type_laser_p2:
  Skills:
  - randomskill{skills=fv_soulcube_laser_straight,fv_soulcube_laser_jumprope,fv_soulcube_laser_hunter,fv_soulcube_laser_chaos} @self
fv_soulcube_type_shoot_p2:
  Skills:
  - randomskill{skills=fv_soulcube_shoot_aimed,fv_soulcube_shoot_burst,fv_soulcube_shoot_ring,fv_soulcube_shoot_fan} @self

fv_soulcube_type_laser_p3:
  Skills:
  - randomskill{skills=fv_soulcube_laser_straight,fv_soulcube_laser_jumprope,fv_soulcube_laser_hunter,fv_soulcube_laser_chaos} @self
fv_soulcube_type_shoot_p3:
  Skills:
  - randomskill{skills=fv_soulcube_shoot_burst,fv_soulcube_shoot_ring,fv_soulcube_shoot_spiral,fv_soulcube_shoot_fan} @self

# The down beam is the same attack in every phase - later phases make it
# drift and turn faster (fv_soulcube_downbeam.yml).
fv_soulcube_type_downbeam:
  Skills:
  - skill{s=fv_soulcube_downbeam} @self

# Every attack ends here.
fv_soulcube_after_attack:
  Skills:
  - setvariable{var=caster.fv_soulcube_mode;type=STRING;value=OPEN}
  - setvariable{var=skill.pb;type=INTEGER;value=<caster.var.fv_soulcube_phasebreak>}
  - setvariable{var=skill.combo;type=INTEGER;value=0}
  - setvariable{var=skill.combo;type=INTEGER;value=1} ?variableequals{var=caster.fv_soulcube_phase;value=3} ?variableequals{var=caster.fv_soulcube_lasttype;value=SHOOT}
  - skill{s=fv_soulcube_phase_break} @self ?variableequals{var=skill.pb;value=1}
  - skill{s=fv_soulcube_loop} @self ?variableequals{var=skill.pb;value=0} ?variableequals{var=skill.combo;value=0}
  - randomskill{skills=fv_soulcube_loop,fv_soulcube_combo} @self ?variableequals{var=skill.pb;value=0} ?variableequals{var=skill.combo;value=1}

# Phase 3: no breather - straight into the next attack.
fv_soulcube_combo:
  Skills:
  - setvariable{var=caster.fv_soulcube_alive;type=INTEGER;value=1;duration=120}
  - skill{s=fv_soulcube_sfx_combo} @self
  - delay 10
  - skill{s=fv_soulcube_pick} @self

fv_soulcube_return_home:
  Skills:
  - skill{s=fv_soulcube_sfx_blink} @self
  - teleport{unsafe=true;preserveyaw=true} @VariableLocation{var=caster.fv_soulcube_home;y=1.25}
  - setvariable{var=caster.fv_soulcube_hpx;type=INTEGER;value=20}
  - setvariable{var=caster.fv_soulcube_hpx_target;type=INTEGER;value=20}
  - skill{s=fv_soulcube_sfx_blink} @self

# Faces the closest player whenever it is not busy attacking.
fv_soulcube_watch:
  Conditions:
  - variableequals{var=caster.fv_soulcube_state;value=FIGHT} true
  - variableequals{var=caster.fv_soulcube_busy;value=0} true
  Skills:
  - rotatetowards{maxyaw=8} @NearestPlayer{r=48}


# ============================================================================
#  PHASES
# ============================================================================
fv_soulcube_check_phase:
  Conditions:
  - variableequals{var=caster.fv_soulcube_state;value=FIGHT} true
  Skills:
  - setvariable{var=skill.hp;type=FLOAT;value="<caster.hp>/<caster.mhp>"}
  - skill{s=fv_soulcube_enter_phase_2} @self ?variableequals{var=caster.fv_soulcube_phase;value=1} ?variableinrange{var=skill.hp;value=0to0.66}
  - skill{s=fv_soulcube_enter_phase_3} @self ?variableequals{var=caster.fv_soulcube_phase;value=2} ?variableinrange{var=skill.hp;value=0to0.33}

fv_soulcube_enter_phase_2:
  Skills:
  - skill{s=fv_soulcube_phase_2} @self
  - setvariable{var=caster.fv_soulcube_phasebreak;type=INTEGER;value=1}
  - skill{s=fv_soulcube_sfx_phase_crack} @self

fv_soulcube_enter_phase_3:
  Skills:
  - skill{s=fv_soulcube_phase_3} @self
  - setvariable{var=caster.fv_soulcube_phasebreak;type=INTEGER;value=1}
  - skill{s=fv_soulcube_sfx_phase_crack} @self

# Played once the current attack is over: it screams, the frame bursts
# ("damage" animation) and a shockwave pushes everyone away.
fv_soulcube_phase_break:
  Skills:
  - setvariable{var=caster.fv_soulcube_phasebreak;type=INTEGER;value=0}
  - setvariable{var=caster.fv_soulcube_busy;type=INTEGER;value=1}
  - setvariable{var=caster.fv_soulcube_alive;type=INTEGER;value=1;duration=200}
  - setvariable{var=caster.fv_soulcube_mode;type=STRING;value=IMMUNE}
  - skill{s=fv_soulcube_stop_body} @self
  - state{mid=fv_soulcube;s=damage;p=10;li=3;lo=8;force=true} @self
  - skill{s=fv_soulcube_sfx_phase_roar} @self
  - delay 6
  - skill{s=fv_soulcube_roar_wave} @self
  - delay 38
  - skill{s=fv_soulcube_play_idle} @self
  - skill{s=fv_soulcube_loop} @self

fv_soulcube_roar_wave:
  Skills:
  - skill{s=fv_soulcube_vfx_shockwave} @self
  - skill{s=fv_soulcube_roar_hit} @PlayersInRadius{r=6}

fv_soulcube_roar_hit:
  TargetConditions:
  - gamemode{m=SURVIVAL,ADVENTURE} true
  Skills:
  - damage{amount=6;ignoreArmor=false;ii=true;pi=true}
  - throw{velocity=12;velocityY=4}


# ============================================================================
#  DAMAGE RULES
# ============================================================================
fv_soulcube_on_damaged:
  Skills:
  # still waking up (or already gone): nothing gets through
  - cancelevent ?!variableequals{var=caster.fv_soulcube_state;value=FIGHT}
  # high up in the air during the down beam / mid phase-roar
  - cancelevent ?variableequals{var=caster.fv_soulcube_mode;value=IMMUNE}
  - skill{s=fv_soulcube_hit_immune} @self ?variableequals{var=caster.fv_soulcube_state;value=FIGHT} ?variableequals{var=caster.fv_soulcube_mode;value=IMMUNE}
  # the shell hardens while the beam is live
  - modifydamage{a=0.5;modifier=MULTIPLY} ?variableequals{var=caster.fv_soulcube_mode;value=ARMORED}
  - skill{s=fv_soulcube_hit_armored} @self ?variableequals{var=caster.fv_soulcube_state;value=FIGHT} ?variableequals{var=caster.fv_soulcube_mode;value=ARMORED}
  # landed after the down beam, dazed: hit it hard now
  - modifydamage{a=1.35;modifier=MULTIPLY} ?variableequals{var=caster.fv_soulcube_mode;value=STAGGER}
  - skill{s=fv_soulcube_hit_stagger} @self ?variableequals{var=caster.fv_soulcube_state;value=FIGHT} ?variableequals{var=caster.fv_soulcube_mode;value=STAGGER}
  - skill{s=fv_soulcube_hit_open} @self ?variableequals{var=caster.fv_soulcube_state;value=FIGHT} ?variableequals{var=caster.fv_soulcube_mode;value=OPEN}
  - skill{s=fv_soulcube_check_phase;delay=1} @self ?variableequals{var=caster.fv_soulcube_state;value=FIGHT}

fv_soulcube_on_interact:
  Skills:
  - cancelevent

fv_soulcube_hit_open:
  Cooldown: 0.25
  Skills:
  - skill{s=fv_soulcube_sfx_hurt} @self

fv_soulcube_hit_stagger:
  Cooldown: 0.25
  Skills:
  - skill{s=fv_soulcube_sfx_hurt_big} @self

fv_soulcube_hit_armored:
  Cooldown: 0.25
  Skills:
  - skill{s=fv_soulcube_sfx_armored} @self

fv_soulcube_hit_immune:
  Cooldown: 0.3
  Skills:
  - skill{s=fv_soulcube_sfx_immune} @self


# ============================================================================
#  EVERY SECOND
# ============================================================================
fv_soulcube_boss_second:
  Skills:
  # tell the block its boss is still alive (expires after 5 s)
  - skill{s=fv_soulcube_link_alive} @MobsInRadius{types=fv_soulcube_block;r=48}
  # the fight loop stopped answering -> restart it cleanly
  - skill{s=fv_soulcube_watchdog} @self ?variableequals{var=caster.fv_soulcube_state;value=FIGHT} ?!variableisset{var=caster.fv_soulcube_alive}
  # nobody within 40 blocks for 15 seconds -> give up and turn back into the block
  - skill{s=fv_soulcube_alone_check} @self ?variableequals{var=caster.fv_soulcube_state;value=FIGHT}

# ---- the link to its block ------------------------------------------------
# The block summons the boss in its own spot, so the boss's block is the
# dormant block at (or hidden right under) the boss's home x / z - within
# 2 blocks, in case summoning nudged the boss onto the block's surface.
# A second arena's block (keep arenas 5+ blocks apart) is never touched.
# The boss hands its home spot to every block nearby; each block then
# checks it against its OWN position (sudoskill: the block casts the
# check, so its position is <caster.l.x.double> - see THE PROBE below).
fv_soulcube_link_send:
  Skills:
  - setvariable{var=target.fv_soulcube_hx;type=FLOAT;value=<caster.var.fv_soulcube_home_x>}
  - setvariable{var=target.fv_soulcube_hz;type=FLOAT;value=<caster.var.fv_soulcube_home_z>}

fv_soulcube_link_alive:
  Skills:
  - skill{s=fv_soulcube_link_send}
  - sudoskill{s=fv_soulcube_link_alive_mine;cat=true}

fv_soulcube_link_reset:
  Skills:
  - skill{s=fv_soulcube_link_send}
  - sudoskill{s=fv_soulcube_link_reset_mine;cat=true}

fv_soulcube_link_defeated:
  Skills:
  - skill{s=fv_soulcube_link_send}
  - sudoskill{s=fv_soulcube_link_defeated_mine;cat=true}

# ---- cast by the block ----
fv_soulcube_link_measure:
  Skills:
  - setvariable{var=caster.fv_soulcube_link_d;type=FLOAT;value="abs((<caster.l.x.double>)-(<caster.var.fv_soulcube_hx>))+abs((<caster.l.z.double>)-(<caster.var.fv_soulcube_hz>))"} @self

fv_soulcube_link_alive_mine:
  Skills:
  - skill{s=fv_soulcube_link_measure} @self
  - setvariable{var=caster.fv_soulcube_boss_alive;type=INTEGER;value=1;duration=100} @self ?variableinrange{var=caster.fv_soulcube_link_d;value=0to2}

fv_soulcube_link_reset_mine:
  Skills:
  - skill{s=fv_soulcube_link_measure} @self
  - skill{s=fv_soulcube_block_restore} @self ?variableinrange{var=caster.fv_soulcube_link_d;value=0to2} ?variableequals{var=caster.fv_soulcube_block;value=AWAKE}

fv_soulcube_link_defeated_mine:
  Skills:
  - skill{s=fv_soulcube_link_measure} @self
  - skill{s=fv_soulcube_block_on_defeat} @self ?variableinrange{var=caster.fv_soulcube_link_d;value=0to2} ?variableequals{var=caster.fv_soulcube_block;value=AWAKE}

# ============================================================================
#  THE PROBE - where is a player (or block) relative to the boss?
# ============================================================================
#  MythicMobs only documents exact coordinates for the CASTER of a skill
#  (<caster.l.x.double>). So the boss never reads a target's position.
#  Instead it writes its own position into the target's variables, and
#  sudoskill makes the target cast fv_soulcube_probe_rel itself - there the
#  target's position is <caster.l.*.double>. The results stay on the target,
#  where the boss's TargetConditions read them:
#     fv_soulcube_dx / _dy / _dz   target minus boss, in blocks (dy = feet
#                                  height relative to the boss's feet)
#     fv_soulcube_hd               distance along the floor
#     fv_soulcube_th               direction from the boss to the target
#                                  (Minecraft yaw degrees)
#  fv_soulcube_probe_back also writes th / hd back onto the boss
#  (fv_soulcube_pth / _phd) for the skills that steer by them.
# ============================================================================
fv_soulcube_probe:
  Skills:
  - setvariable{var=target.fv_soulcube_hd;type=FLOAT;value=99}
  - setvariable{var=target.fv_soulcube_dy;type=FLOAT;value=99}
  - setvariable{var=target.fv_soulcube_bx;type=FLOAT;value=<caster.l.x.double>}
  - setvariable{var=target.fv_soulcube_by;type=FLOAT;value=<caster.l.y.double>}
  - setvariable{var=target.fv_soulcube_bz;type=FLOAT;value=<caster.l.z.double>}
  - sudoskill{s=fv_soulcube_probe_rel;cat=true}

# ---- cast by the target ----
fv_soulcube_probe_rel:
  Skills:
  - setvariable{var=caster.fv_soulcube_dx;type=FLOAT;value="(<caster.l.x.double>)-(<caster.var.fv_soulcube_bx>)"} @self
  - setvariable{var=caster.fv_soulcube_dy;type=FLOAT;value="(<caster.l.y.double>)-(<caster.var.fv_soulcube_by>)"} @self
  - setvariable{var=caster.fv_soulcube_dz;type=FLOAT;value="(<caster.l.z.double>)-(<caster.var.fv_soulcube_bz>)"} @self
  - setvariable{var=caster.fv_soulcube_hd;type=FLOAT;value="sqrt((<caster.var.fv_soulcube_dx>)^2+(<caster.var.fv_soulcube_dz>)^2)"} @self
  - setvariable{var=caster.fv_soulcube_th;type=FLOAT;value="todegree(atan2(0-(<caster.var.fv_soulcube_dx>),<caster.var.fv_soulcube_dz>))"} @self

# Probe, then hand the direction and distance back to the boss (the boss is
# the trigger of the sudoskill).
fv_soulcube_probe_back:
  Skills:
  - skill{s=fv_soulcube_probe}
  - sudoskill{s=fv_soulcube_probe_back_send;cat=true}

fv_soulcube_probe_back_send:
  Skills:
  - setvariable{var=target.fv_soulcube_pth;type=FLOAT;value=<caster.var.fv_soulcube_th>} @trigger
  - setvariable{var=target.fv_soulcube_phd;type=FLOAT;value=<caster.var.fv_soulcube_hd>} @trigger


fv_soulcube_alone_check:
  Skills:
  - setvariable{var=caster.fv_soulcube_alone;type=INTEGER;value=0} @self ?playerwithin{d=40}
  - variableadd{var=caster.fv_soulcube_alone;amount=1} @self ?!playerwithin{d=40}
  - skill{s=fv_soulcube_reset} @self ?variableinrange{var=caster.fv_soulcube_alone;value=15to99999}

fv_soulcube_reset:
  Skills:
  - setvariable{var=caster.fv_soulcube_state;type=STRING;value=RESET}
  - skill{s=fv_soulcube_abort} @self
  - skill{s=fv_soulcube_sfx_reset} @self
  - skill{s=fv_soulcube_link_reset} @MobsInRadius{types=fv_soulcube_block;r=48}
  - remove{delay=4} @self

fv_soulcube_watchdog:
  Skills:
  - skill{s=fv_soulcube_abort} @self
  - skill{s=fv_soulcube_play_idle} @self
  - skill{s=fv_soulcube_height_to_idle} @self
  - skill{s=fv_soulcube_after_attack} @self

# Stops every running attack loop at its next tick.
fv_soulcube_abort:
  Skills:
  - setvariable{var=caster.fv_soulcube_beam_n;type=INTEGER;value=0}
  - setvariable{var=caster.fv_soulcube_aim_n;type=INTEGER;value=0}
  - setvariable{var=caster.fv_soulcube_db_n;type=INTEGER;value=0}
  - setvariable{var=caster.fv_soulcube_shots;type=INTEGER;value=0}
  - setvariable{var=caster.fv_soulcube_mode;type=STRING;value=OPEN}


# ============================================================================
#  HEIGHT  (in model pixels above the floor, 16 px = 1 block)
# ============================================================================
#  Set the target, start the stepper. Only one stepper ever runs; it reads
#  the target every tick, so a new target simply redirects it. It moves
#  2 px per tick (1 px for the last odd pixel) and keeps fv_soulcube_hpx exact.
# ============================================================================
# floating between attacks: 1.25 blocks
fv_soulcube_height_to_idle:
  Skills:
  - setvariable{var=caster.fv_soulcube_hpx_target;type=INTEGER;value=20}
  - skill{s=fv_soulcube_height_start} @self

# chest laser / shooting: beam and shots fly at chest height
fv_soulcube_height_to_aim:
  Skills:
  - setvariable{var=caster.fv_soulcube_hpx_target;type=INTEGER;value=16}
  - skill{s=fv_soulcube_height_start} @self

# low laser sweeps (attack1): the frame's lowest corner just touches the floor
fv_soulcube_height_to_low:
  Skills:
  - setvariable{var=caster.fv_soulcube_hpx_target;type=INTEGER;value=9}
  - skill{s=fv_soulcube_height_start} @self

# landed after the down beam (attack2's landing and "damage" while dazed)
fv_soulcube_height_to_landed:
  Skills:
  - setvariable{var=caster.fv_soulcube_hpx_target;type=INTEGER;value=16}
  - skill{s=fv_soulcube_height_start} @self

# down beam: the beam's tip and the impact ring float above the floor
fv_soulcube_height_to_beam:
  Skills:
  - setvariable{var=caster.fv_soulcube_hpx_target;type=INTEGER;value=12}
  - skill{s=fv_soulcube_height_start} @self

fv_soulcube_height_start:
  Skills:
  - skill{s=fv_soulcube_height_step} @self ?!variableisset{var=caster.fv_soulcube_hmoving}

fv_soulcube_height_step:
  Skills:
  - setvariable{var=caster.fv_soulcube_hmoving;type=INTEGER;value=1;duration=3}
  - setvariable{var=skill.d;type=INTEGER;value="<caster.var.fv_soulcube_hpx_target>-<caster.var.fv_soulcube_hpx>"}
  - skill{s=fv_soulcube_h_up2} @self ?variableinrange{var=skill.d;value=2to99999}
  - skill{s=fv_soulcube_h_up1} @self ?variableequals{var=skill.d;value=1}
  - skill{s=fv_soulcube_h_down1} @self ?variableequals{var=skill.d;value=-1}
  - skill{s=fv_soulcube_h_down2} @self ?variableinrange{var=skill.d;value=-99999to-2}
  - skill{s=fv_soulcube_height_step;delay=1} @self ?!variableequals{var=skill.d;value=0}
  - variableunset{var=caster.fv_soulcube_hmoving} ?variableequals{var=skill.d;value=0}

fv_soulcube_h_up2:
  Skills:
  - teleport{unsafe=true;preserveyaw=true} @SelfLocation{y=0.125}
  - variableadd{var=caster.fv_soulcube_hpx;amount=2}
fv_soulcube_h_up1:
  Skills:
  - teleport{unsafe=true;preserveyaw=true} @SelfLocation{y=0.0625}
  - variableadd{var=caster.fv_soulcube_hpx;amount=1}
fv_soulcube_h_down1:
  Skills:
  - teleport{unsafe=true;preserveyaw=true} @SelfLocation{y=-0.0625}
  - variableadd{var=caster.fv_soulcube_hpx;amount=-1}
fv_soulcube_h_down2:
  Skills:
  - teleport{unsafe=true;preserveyaw=true} @SelfLocation{y=-0.125}
  - variableadd{var=caster.fv_soulcube_hpx;amount=-2}


# ============================================================================
#  ANIMATION HELPERS
# ============================================================================
#  Every animation of this model has "override" set, so whichever one is
#  playing fully owns the model. A new animation is always started after
#  removing the others (each fades out with the lerp-out it was started
#  with), so two of them never stack.
# ============================================================================
fv_soulcube_stop_body:
  Skills:
  - state{mid=fv_soulcube;s=on_spawn;p=10;r=true} @self
  - state{mid=fv_soulcube;s=idle;p=10;r=true} @self
  - state{mid=fv_soulcube;s=attack1;p=10;r=true} @self
  - state{mid=fv_soulcube;s=attack2;p=10;r=true} @self
  - state{mid=fv_soulcube;s=shooting;p=10;r=true} @self
  - state{mid=fv_soulcube;s=damage;p=10;r=true} @self

fv_soulcube_play_idle:
  Skills:
  - skill{s=fv_soulcube_stop_body} @self
  - state{mid=fv_soulcube;s=idle;p=10;li=6;lo=6;force=true} @self

fv_soulcube_anim_attack1:
  Skills:
  - skill{s=fv_soulcube_stop_body} @self
  - state{mid=fv_soulcube;s=attack1;p=10;li=4;lo=6;speed=1.0;force=true} @self ?variableequals{var=caster.fv_soulcube_phase;value=1}
  - state{mid=fv_soulcube;s=attack1;p=10;li=4;lo=6;speed=1.1;force=true} @self ?variableequals{var=caster.fv_soulcube_phase;value=2}
  - state{mid=fv_soulcube;s=attack1;p=10;li=4;lo=6;speed=1.2;force=true} @self ?variableequals{var=caster.fv_soulcube_phase;value=3}

fv_soulcube_anim_attack2:
  Skills:
  - skill{s=fv_soulcube_stop_body} @self
  - state{mid=fv_soulcube;s=attack2;p=10;li=4;lo=4;speed=1.0;force=true} @self ?variableequals{var=caster.fv_soulcube_phase;value=1}
  - state{mid=fv_soulcube;s=attack2;p=10;li=4;lo=4;speed=1.1;force=true} @self ?variableequals{var=caster.fv_soulcube_phase;value=2}
  - state{mid=fv_soulcube;s=attack2;p=10;li=4;lo=4;speed=1.2;force=true} @self ?variableequals{var=caster.fv_soulcube_phase;value=3}

# Restarted for every shot (force=true restarts a playing state), so a
# volley reads as rapid recoil. Every pattern fires again well before the
# 50 tick animation could run out, and hands over to idle before it ends.
fv_soulcube_anim_shoot:
  Skills:
  - state{mid=fv_soulcube;s=idle;p=10;r=true} @self
  - state{mid=fv_soulcube;s=shooting;p=10;li=2;lo=6;speed=1.0;force=true} @self ?variableequals{var=caster.fv_soulcube_phase;value=1}
  - state{mid=fv_soulcube;s=shooting;p=10;li=2;lo=6;speed=1.1;force=true} @self ?variableequals{var=caster.fv_soulcube_phase;value=2}
  - state{mid=fv_soulcube;s=shooting;p=10;li=2;lo=6;speed=1.2;force=true} @self ?variableequals{var=caster.fv_soulcube_phase;value=3}

# Dazed on the floor (the "damage" animation loops seamlessly).
fv_soulcube_anim_dazed:
  Skills:
  - skill{s=fv_soulcube_stop_body} @self
  - state{mid=fv_soulcube;s=damage;p=10;li=3;lo=8;force=true} @self


# ============================================================================
#  DEATH
# ============================================================================
#  The model is handed to an effect carrier (fv_soulcube_deathfx) standing in
#  the same spot, which plays "death" and everything that goes with it:
#     0 - 7    lifts 46 px                    7 - 49   light rays spin out
#    49 - 58   rays collapse, frame closes, eye shuts
#    58 - 80   silence (heartbeat)            80       the block SHATTERS
#    85+       nothing left but drifting souls
# ============================================================================
fv_soulcube_on_death:
  Skills:
  - setvariable{var=caster.fv_soulcube_state;type=STRING;value=DEAD}
  - skill{s=fv_soulcube_abort} @self
  - summon{type=fv_soulcube_deathfx;amount=1;radius=0} @SelfLocation
  - model{mid=fv_soulcube;remove=true} @self
  - skill{s=fv_soulcube_link_defeated} @MobsInRadius{types=fv_soulcube_block;r=48}

fv_soulcube_death_start:
  Skills:
  - model{mid=fv_soulcube;usm=true;hitbox=false;lockpitch=true;damagetint=false;showshadow=false;radius=64;initrender=false} @self
  - defaultstate{mid=fv_soulcube;type=IDLE;state=blank;li=0;lo=0} @self
  - defaultstate{mid=fv_soulcube;type=WALK;state=blank;li=0;lo=0} @self
  - bodyrotation{mid=fv_soulcube;playermode=false;mh=0;mb=0;stable=0;rdelay=0;rduration=0} @self
  - brightness{mid=fv_soulcube;b=15;s=15} @self
  - state{mid=fv_soulcube;s=death;p=10;li=0;lo=0;force=true} @self
  - renderinit{mid=fv_soulcube} @self
  - skill{s=fv_soulcube_death_timeline} @self

fv_soulcube_death_timeline:
  Skills:
  - skill{s=fv_soulcube_sfx_death_scream} @self
  - delay 7
  - skill{s=fv_soulcube_sfx_death_rays} @self
  - delay 42
  - skill{s=fv_soulcube_sfx_death_implode} @self
  - delay 9
  - skill{s=fv_soulcube_sfx_death_close} @self
  - delay 4
  - skill{s=fv_soulcube_sfx_death_heartbeat} @self
  - delay 10
  - skill{s=fv_soulcube_sfx_death_heartbeat} @self
  - delay 10
  - skill{s=fv_soulcube_sfx_death_shatter} @self
  - delay 12
  # the animation is invisible from here on and "death" would loop -
  # take the model off before that can ever happen
  - model{mid=fv_soulcube;remove=true} @self
  - skill{s=fv_soulcube_sfx_death_souls} @self
  - delay 40
  - skill{s=fv_soulcube_sfx_death_souls} @self
  - delay 20
  - remove @self
