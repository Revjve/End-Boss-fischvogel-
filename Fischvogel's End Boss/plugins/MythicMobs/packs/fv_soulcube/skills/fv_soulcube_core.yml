# ============================================================================
#  Soul Cube (FischVogel) - Core
# ============================================================================
#  The block, waking up, the fight loop, phases, damage rules, movement and
#  death. The three attacks live in their own files:
#     fv_soulcube_laser.yml      attack1  - 4 laser patterns
#     fv_soulcube_downbeam.yml   attack2  - the down beam
#     fv_soulcube_shooting.yml   shooting - 5 projectile patterns
#     fv_soulcube_fx.yml         every sound / particle cue
#
#  ---- TUNING CHEAT SHEET -------------------------------------------------
#   Boss health ............. Health: in mobs/fv_soulcube_mobs.yml
#   Block respawn time ...... fv_soulcube_block_settings (seconds, -1 = one-time)
#   Arena radius ............ fv_soulcube_boss_settings (the down beam never leaves it)
#   Phase thresholds ........ fv_soulcube_check_phase (66% / 33% health)
#   Speed per phase ......... speed= on the state{} lines in fv_soulcube_anim_*
#   Idle time per phase ..... fv_soulcube_t_idle / fv_soulcube_t_idle_rand in the
#                             PHASE TABLES below (ticks, 20 = 1 second)
#   Crash-landing window .... fv_soulcube_t_stagger in the PHASE TABLES
#   Damage taken while it
#     attacks / is stunned .. fv_soulcube_on_damaged (x0.5 / x1.35)
#   Attack damage ........... the damage{} lines, one per hit type:
#                               laser 14 ........ fv_soulcube_beam_hit
#                               down beam 14 .... fv_soulcube_downbeam_hit
#                               projectile 7+3 .. fv_soulcube_proj_hit / _splash
#                               landing 6 ....... fv_soulcube_land_hit
#                               phase roar 6 .... fv_soulcube_roar_hit
#   Which attacks a phase
#     may pick .............. fv_soulcube_type_* lists below
#
#  ---- HOW THE FIGHT FLOWS ------------------------------------------------
#   block clicked -> boss summoned in the same spot -> on_spawn (7 s,
#   cannot be damaged) -> LOOP:
#      idle (open for hits) -> pick an attack type that is NOT the same as
#      last time (laser / down beam / shooting) -> random pattern of that
#      type -> recover -> LOOP
#   Health 66% / 33%: phase 2 / phase 3. The change happens right away, the
#   roar + shockwave plays as soon as the current attack is finished.
#   Phase 3: after a shooting attack it may chain straight into the next
#   attack without idling.
#
#  ---- DAMAGE RULES (fv_soulcube_on_damaged) ------------------------------------
#   WAKING   no damage (on_spawn is playing)
#   IMMUNE   no damage (4 blocks up during the down beam, phase roar)
#   ARMORED  x0.5  while a laser beam is live
#   OPEN     x1    idle, wind-ups, shooting
#   STAGGER  x1.35 dazed on the floor after the down beam, when it lands
#
#  ---- HEIGHT ---------------------------------------------------------------
#   All heights are in model pixels (16 px = 1 block) above the floor the
#   block sat on (fv_soulcube_hpx). Every height was measured against the
#   blueprint so the frame never touches the floor (the corners hang up to
#   9 px below the cube's origin in attack1):
#      between attacks .......... 20 px  (floats 1.25 blocks up)
#      chest laser / shooting ... 16 px  (beam and shots at chest height)
#      low laser sweep ..........  9 px  (beam at hip height - jump it)
#      landed / dazed ........... 16 px  (1 block; the frame hangs half a
#                                         block above the floor)
#      down beam (attack2) ...... 12 px  (the animation lifts the cube 4
#                                         more blocks; the beam ends 2.6 px
#                                         below the boss, so its tip and the
#                                         impact ring float just over half
#                                         a block above the floor)
#   Moves are done in exact pixel steps by fv_soulcube_height_step, so the height
#   can never drift over a long fight. Use a flat arena floor.
# ============================================================================


# ============================================================================
#  PHASE TABLES
# ============================================================================
#  Every attack animation runs faster in later phases (speed 1.0 / 1.1 /
#  1.2, set on the state{} lines in fv_soulcube_anim_*). The tick numbers below
#  are the animation's own key moments divided by that speed, so sounds,
#  damage and the visuals stay in sync:
#     attack1   beam on 50, beam off 231, settled 252
#     attack2   beam on 50, ring pulses 67 / 87 / 107, beam off 147,
#               descent 180, landed 201 (the dazed animation takes over
#               right there, 2 ticks before attack2 would end at 203)
#     shooting  50 ticks; a shot is fired the moment it (re)starts and idle
#               takes over 6 ticks before it ends
#  If you change a speed= value, redo the division for that phase.
# ============================================================================
fv_soulcube_phase_1:
  Skills:
  - setvariable{var=caster.fv_soulcube_phase;type=INTEGER;value=1}
  # idle between attacks: t_idle + random(0 .. t_idle_rand) ticks
  - setvariable{var=caster.fv_soulcube_t_idle;type=INTEGER;value=50}
  - setvariable{var=caster.fv_soulcube_t_idle_rand;type=INTEGER;value=20}
  # dazed on the floor after the down beam lands
  - setvariable{var=caster.fv_soulcube_t_stagger;type=INTEGER;value=60}
  # attack1 (laser): lock = beam on - 8 (the warning ping), dur = beam live, rec = recoil
  - setvariable{var=caster.fv_soulcube_t_a1_lock;type=INTEGER;value=42}
  - setvariable{var=caster.fv_soulcube_t_a1_dur;type=INTEGER;value=181}
  - setvariable{var=caster.fv_soulcube_t_a1_rec;type=INTEGER;value=21}
  # attack2 (down beam): beam on, beam time, ring pulse gaps, hover, descent
  - setvariable{var=caster.fv_soulcube_t_a2_ign;type=INTEGER;value=50}
  - setvariable{var=caster.fv_soulcube_t_a2_beam;type=INTEGER;value=97}
  - setvariable{var=caster.fv_soulcube_t_a2_p1;type=INTEGER;value=17}
  - setvariable{var=caster.fv_soulcube_t_a2_p2;type=INTEGER;value=20}
  - setvariable{var=caster.fv_soulcube_t_a2_p3;type=INTEGER;value=20}
  - setvariable{var=caster.fv_soulcube_t_a2_hover;type=INTEGER;value=33}
  - setvariable{var=caster.fv_soulcube_t_a2_desc;type=INTEGER;value=21}
  # shooting animation: from the last shot until idle takes over
  - setvariable{var=caster.fv_soulcube_t_sh_settle;type=INTEGER;value=44}
  # laser pattern settings
  - setvariable{var=caster.fv_soulcube_flick_every;type=INTEGER;value=99999}
  - setvariable{var=caster.fv_soulcube_chaos_lo;type=INTEGER;value=4}
  - setvariable{var=caster.fv_soulcube_chaos_hi;type=INTEGER;value=6}
  - setvariable{var=caster.fv_soulcube_chaos_min;type=INTEGER;value=30}
  - setvariable{var=caster.fv_soulcube_chaos_max;type=INTEGER;value=46}
  # shooting pattern settings (n_ = number of shots / volleys, t_ = ticks)
  #   aimed: tracking time before each shot, then ping -> shot after t_aimed_lock
  #   burst: v_burst = burst shot speed in blocks per tick (lead aiming)
  - setvariable{var=caster.fv_soulcube_n_aimed;type=INTEGER;value=2}
  - setvariable{var=caster.fv_soulcube_t_aimed_gap;type=INTEGER;value=18}
  - setvariable{var=caster.fv_soulcube_t_aimed_lock;type=INTEGER;value=9}
  - setvariable{var=caster.fv_soulcube_n_burst;type=INTEGER;value=6}
  - setvariable{var=caster.fv_soulcube_t_burst_gap;type=INTEGER;value=7}
  - setvariable{var=caster.fv_soulcube_v_burst;type=FLOAT;value=0.7}
  - setvariable{var=caster.fv_soulcube_n_ring;type=INTEGER;value=12}
  - setvariable{var=caster.fv_soulcube_n_fan;type=INTEGER;value=2}
  - setvariable{var=caster.fv_soulcube_t_fan_gap;type=INTEGER;value=16}
  - setvariable{var=caster.fv_soulcube_n_spiral;type=INTEGER;value=20}

fv_soulcube_phase_2:
  Skills:
  - setvariable{var=caster.fv_soulcube_phase;type=INTEGER;value=2}
  - setvariable{var=caster.fv_soulcube_t_idle;type=INTEGER;value=34}
  - setvariable{var=caster.fv_soulcube_t_idle_rand;type=INTEGER;value=16}
  - setvariable{var=caster.fv_soulcube_t_stagger;type=INTEGER;value=46}
  - setvariable{var=caster.fv_soulcube_t_a1_lock;type=INTEGER;value=37}
  - setvariable{var=caster.fv_soulcube_t_a1_dur;type=INTEGER;value=165}
  - setvariable{var=caster.fv_soulcube_t_a1_rec;type=INTEGER;value=19}
  - setvariable{var=caster.fv_soulcube_t_a2_ign;type=INTEGER;value=45}
  - setvariable{var=caster.fv_soulcube_t_a2_beam;type=INTEGER;value=89}
  - setvariable{var=caster.fv_soulcube_t_a2_p1;type=INTEGER;value=16}
  - setvariable{var=caster.fv_soulcube_t_a2_p2;type=INTEGER;value=18}
  - setvariable{var=caster.fv_soulcube_t_a2_p3;type=INTEGER;value=18}
  - setvariable{var=caster.fv_soulcube_t_a2_hover;type=INTEGER;value=30}
  - setvariable{var=caster.fv_soulcube_t_a2_desc;type=INTEGER;value=19}
  - setvariable{var=caster.fv_soulcube_t_sh_settle;type=INTEGER;value=39}
  - setvariable{var=caster.fv_soulcube_flick_every;type=INTEGER;value=60}
  - setvariable{var=caster.fv_soulcube_chaos_lo;type=INTEGER;value=4}
  - setvariable{var=caster.fv_soulcube_chaos_hi;type=INTEGER;value=7}
  - setvariable{var=caster.fv_soulcube_chaos_min;type=INTEGER;value=22}
  - setvariable{var=caster.fv_soulcube_chaos_max;type=INTEGER;value=40}
  - setvariable{var=caster.fv_soulcube_n_aimed;type=INTEGER;value=3}
  - setvariable{var=caster.fv_soulcube_t_aimed_gap;type=INTEGER;value=14}
  - setvariable{var=caster.fv_soulcube_t_aimed_lock;type=INTEGER;value=8}
  - setvariable{var=caster.fv_soulcube_n_burst;type=INTEGER;value=8}
  - setvariable{var=caster.fv_soulcube_t_burst_gap;type=INTEGER;value=5}
