# ============================================================================
#  Soul Cube (FischVogel) - Attack 2: DOWN BEAM  (animation "attack2")
# ============================================================================
#  What the animation does (100% speed, ticks):
#     0 - 15   the cube rises 64 px (4 blocks) and turns its eye to the floor
#    47 - 52   the frame bursts open, the beam fires straight DOWN out of the
#              eye and a glowing impact ring appears where it hits the floor
#    50 - 147  BEAM: it drifts after the nearest player; the ring's walls
#              pulse at 67, 87 and 107
#   147        beam and ring off
#   180 - 201  the cube comes back down and lands
#  The model stays on the boss, so the boss itself glides 12 px (3/4 of a
#  block) above the floor while the cube is drawn 4 blocks above that: the
#  beam always comes down right under the cube and ends in the glowing ring,
#  which floats just over half a block above the floor.
#
#  While it is up there it cannot be hit (IMMUNE). After landing it is dazed
#  ("damage" animation) on the floor for a few seconds and takes x1.35
#  damage - that is the moment to go in.
#
#  DANGER
#     the beam ......... standing in its impact ring (centre within 0.65 blocks
#                        of the beam): 14 damage, the same as the chest laser,
#                        then 0.5 s of laser immunity. The beam reaches from
#                        the floor up to the cube - jumping does not help,
#                        walk out of the ring.
#     landing .......... radius 2.5, 6 damage
#
#  MOVEMENT  It turns towards the nearest player and slowly drifts after
#            them - slower than walking, so keep moving:
#               phase 1 / 2 / 3 ... 2.2 / 2.8 / 3.4 blocks a second
#               turning ........... 6 / 8 / 10 degrees a tick (always the
#                                   short way round)
#            When it catches you it stops on top of you; if you get behind
#            it, it turns round on the spot first. It never leaves
#            fv_soulcube_arena_r (fv_soulcube_boss_settings, 18 blocks) around its block -
#            past that it turns back home.
# ============================================================================


fv_soulcube_downbeam:
  Skills:
  - setvariable{var=caster.fv_soulcube_lasttype;type=STRING;value=DOWNBEAM}
  - setvariable{var=caster.fv_soulcube_mode;type=STRING;value=OPEN}
  - setvariable{var=caster.fv_soulcube_alive;type=INTEGER;value=1;duration=440}
  - setvariable{var=caster.fv_soulcube_db_n;type=INTEGER;value=0}
  - setvariable{var=caster.fv_soulcube_db_home;type=INTEGER;value=0}
  # most it may turn per tick: 6 / 8 / 10 degrees
  - setvariable{var=caster.fv_soulcube_db_maxturn;type=FLOAT;value=6}
  - setvariable{var=caster.fv_soulcube_db_maxturn;type=FLOAT;value=8} ?variableequals{var=caster.fv_soulcube_phase;value=2}
  - setvariable{var=caster.fv_soulcube_db_maxturn;type=FLOAT;value=10} ?variableequals{var=caster.fv_soulcube_phase;value=3}
  - skill{s=fv_soulcube_anim_attack2} @self
  - skill{s=fv_soulcube_sfx_downbeam_rise} @self
  # the animation lifts the cube 4 blocks; at the same time the boss sinks
  # from 20 to 12 px above the floor (8 px in 4 ticks, so the cube still
  # rises on screen)
  - skill{s=fv_soulcube_height_to_beam} @self
  # the beam fires t_a2_ign ticks after the animation started; 8 of them
  # are spent here, the rest is waited out below
  - setvariable{var=skill.wait;type=INTEGER;value="max(1,(<caster.var.fv_soulcube_t_a2_ign>)-8)"}
  - delay 8
  - setvariable{var=caster.fv_soulcube_mode;type=STRING;value=IMMUNE}
  - skill{s=fv_soulcube_downbeam_telegraph} @self
  - delay{ticks=<skill.var.wait>}
  # ---- BEAM ON ----
  - skill{s=fv_soulcube_sfx_downbeam_ignite} @self
  - setvariable{var=caster.fv_soulcube_db_n;type=INTEGER;value=<caster.var.fv_soulcube_t_a2_beam>}
  - skill{s=fv_soulcube_downbeam_tick} @self
  - skill{s=fv_soulcube_downbeam_pulses} @self
  - delay{ticks=<caster.var.fv_soulcube_t_a2_beam>}
  # ---- BEAM OFF ----
  - setvariable{var=caster.fv_soulcube_db_n;type=INTEGER;value=0}
  - skill{s=fv_soulcube_sfx_downbeam_off} @self
  - delay{ticks=<caster.var.fv_soulcube_t_a2_hover>}
  # ---- COMING DOWN ----
  # lands 16 px (1 block) up: the frame hangs half a block above the floor
  - skill{s=fv_soulcube_height_to_landed} @self
  - skill{s=fv_soulcube_sfx_downbeam_descend} @self
  - delay{ticks=<caster.var.fv_soulcube_t_a2_desc>}
  # ---- LANDED ---- (dazed takes over 2 ticks before attack2 ends)
  - skill{s=fv_soulcube_downbeam_land} @self
  - skill{s=fv_soulcube_downbeam_dazed} @self

# Hovering up there while the beam charges: the spot it is about to burn
# is marked on the floor.
fv_soulcube_downbeam_telegraph:
  Skills:
  - skill{s=fv_soulcube_sfx_downbeam_charge} @self
  - skill{s=fv_soulcube_vfx_downbeam_mark} @self

# Every tick while the beam is on: 1. turn, 2. drift, 3. burn.
# Past the arena radius (fv_soulcube_boss_settings) it stops chasing and heads
# back towards its block until it is 3 blocks inside again (so it never
# flips between the two every tick at the edge).
fv_soulcube_downbeam_tick:
  Skills:
  - variableadd{var=caster.fv_soulcube_db_n;amount=-1}
  - setvariable{var=skill.d;type=FLOAT;value="sqrt(((<caster.l.x.double>)-(<caster.var.fv_soulcube_home_x>))^2+((<caster.l.z.double>)-(<caster.var.fv_soulcube_home_z>))^2)"}
  - setvariable{var=skill.far;type=FLOAT;value="(<skill.var.d>)>(<caster.var.fv_soulcube_arena_r>)"}
  - setvariable{var=skill.back;type=FLOAT;value="(<skill.var.d>)<(<caster.var.fv_soulcube_arena_r>)-3"}
  - setvariable{var=caster.fv_soulcube_db_home;type=INTEGER;value=1} ?variableinrange{var=skill.far;value=0.5to2}
  - setvariable{var=caster.fv_soulcube_db_home;type=INTEGER;value=0} ?variableinrange{var=skill.back;value=0.5to2}
  - skill{s=fv_soulcube_downbeam_steer} @self ?variableequals{var=caster.fv_soulcube_db_home;value=0}
  - skill{s=fv_soulcube_downbeam_leash} @self ?variableequals{var=caster.fv_soulcube_db_home;value=1}
  # drifts only while it faces its target (within 90 degrees) and is not
  # already right above them: when it catches you it stops on top of you
  # and turns round on the spot instead of circling you
  - skill{s=fv_soulcube_downbeam_drift} @self ?variableinrange{var=caster.fv_soulcube_db_dist;value=0.6to99999} ?variableinrange{var=caster.fv_soulcube_db_turn;value=-90to90}
  - skill{s=fv_soulcube_downbeam_check} @PlayersInRadius{r=6}
  - skill{s=fv_soulcube_vfx_downbeam} @self
  - skill{s=fv_soulcube_sfx_downbeam_roar} @self
  - skill{s=fv_soulcube_downbeam_tick;delay=1} @self ?variableinrange{var=caster.fv_soulcube_db_n;value=1to99999} ?variableequals{var=caster.fv_soulcube_state;value=FIGHT}

# Turns towards the nearest player by at most fv_soulcube_db_maxturn degrees.
# The angle is worked out here (always the short way round, whatever the
# boss' yaw has wound up to after a spinning laser) instead of with
# rotatetowards, then applied in whole-degree steps.
fv_soulcube_downbeam_steer:
  Skills:
  - setvariable{var=caster.fv_soulcube_db_turn;type=FLOAT;value=0}
  - setvariable{var=caster.fv_soulcube_db_dist;type=FLOAT;value=99}
  - skill{s=fv_soulcube_downbeam_aim} @NearestPlayer{r=48}
  - setvariable{var=skill.step;type=FLOAT;value="signum(<caster.var.fv_soulcube_db_turn>)*min(abs(<caster.var.fv_soulcube_db_turn>),<caster.var.fv_soulcube_db_maxturn>)"}
  - setrotation{relative=true;yaw=10} @self ?variableinrange{var=skill.step;value=9.5to10.5}
  - setrotation{relative=true;yaw=9} @self ?variableinrange{var=skill.step;value=8.5to9.5}
  - setrotation{relative=true;yaw=8} @self ?variableinrange{var=skill.step;value=7.5to8.5}
  - setrotation{relative=true;yaw=7} @self ?variableinrange{var=skill.step;value=6.5to7.5}
  - setrotation{relative=true;yaw=6} @self ?variableinrange{var=skill.step;value=5.5to6.5}
  - setrotation{relative=true;yaw=5} @self ?variableinrange{var=skill.step;value=4.5to5.5}
  - setrotation{relative=true;yaw=4} @self ?variableinrange{var=skill.step;value=3.5to4.5}
  - setrotation{relative=true;yaw=3} @self ?variableinrange{var=skill.step;value=2.5to3.5}
  - setrotation{relative=true;yaw=2} @self ?variableinrange{var=skill.step;value=1.5to2.5}
  - setrotation{relative=true;yaw=1} @self ?variableinrange{var=skill.step;value=0.5to1.5}
  - setrotation{relative=true;yaw=-1} @self ?variableinrange{var=skill.step;value=-1.5to-0.5}
  - setrotation{relative=true;yaw=-2} @self ?variableinrange{var=skill.step;value=-2.5to-1.5}
  - setrotation{relative=true;yaw=-3} @self ?variableinrange{var=skill.step;value=-3.5to-2.5}
  - setrotation{relative=true;yaw=-4} @self ?variableinrange{var=skill.step;value=-4.5to-3.5}
  - setrotation{relative=true;yaw=-5} @self ?variableinrange{var=skill.step;value=-5.5to-4.5}
  - setrotation{relative=true;yaw=-6} @self ?variableinrange{var=skill.step;value=-6.5to-5.5}
  - setrotation{relative=true;yaw=-7} @self ?variableinrange{var=skill.step;value=-7.5to-6.5}
  - setrotation{relative=true;yaw=-8} @self ?variableinrange{var=skill.step;value=-8.5to-7.5}
  - setrotation{relative=true;yaw=-9} @self ?variableinrange{var=skill.step;value=-9.5to-8.5}
  - setrotation{relative=true;yaw=-10} @self ?variableinrange{var=skill.step;value=-10.5to-9.5}

# Runs on the nearest player: how far (degrees, -180 to 180) the boss has
# to turn to face them, and how far away they are along the floor (the
# boss floats 12 px up, so a 3D distance would never get close to 0).
fv_soulcube_downbeam_aim:
  Skills:
  - setvariable{var=caster.fv_soulcube_db_dist;type=FLOAT;value="sqrt(((<target.l.x.double>)-(<caster.l.x.double>))^2+((<target.l.z.double>)-(<caster.l.z.double>))^2)"}
  - setvariable{var=caster.fv_soulcube_db_turn;type=FLOAT;value="((todegree(atan2(0-((<target.l.x.double>)-(<caster.l.x.double>)),(<target.l.z.double>)-(<caster.l.z.double>)))-(<caster.l.yaw>))%360+540)%360-180"}

# Turns 20 degrees per tick towards home (worked out from the stored home
# coordinates, so it needs nothing else).
fv_soulcube_downbeam_leash:
  Skills:
  - setvariable{var=caster.fv_soulcube_db_turn;type=FLOAT;value=0}
  - setvariable{var=caster.fv_soulcube_db_dist;type=FLOAT;value=99}
  - setvariable{var=skill.home;type=FLOAT;value="todegree(atan2(0-((<caster.var.fv_soulcube_home_x>)-(<caster.l.x.double>)),(<caster.var.fv_soulcube_home_z>)-(<caster.l.z.double>)))"}
  - setvariable{var=skill.turn;type=FLOAT;value="(((<skill.var.home>)-(<caster.l.yaw>))%360+540)%360-180"}
  - setrotation{relative=true;yaw=20} @self ?variableinrange{var=skill.turn;value=10to180}
  - setrotation{relative=true;yaw=-20} @self ?variableinrange{var=skill.turn;value=-180to-10}

# Forward along the floor, in the direction it faces (blocks per tick).
fv_soulcube_downbeam_drift:
  Skills:
  - teleport{unsafe=true;preserveyaw=true} @Forward{f=0.11;lockpitch=true;uel=false} ?variableequals{var=caster.fv_soulcube_phase;value=1}
  - teleport{unsafe=true;preserveyaw=true} @Forward{f=0.14;lockpitch=true;uel=false} ?variableequals{var=caster.fv_soulcube_phase;value=2}
  - teleport{unsafe=true;preserveyaw=true} @Forward{f=0.17;lockpitch=true;uel=false} ?variableequals{var=caster.fv_soulcube_phase;value=3}

# The three wall pulses of the impact ring (67 / 87 / 107 at 100% speed):
# the ring flares up. Only a visual and a sound - the beam is the danger.
fv_soulcube_downbeam_pulses:
  Skills:
  - delay{ticks=<caster.var.fv_soulcube_t_a2_p1>}
  - skill{s=fv_soulcube_downbeam_pulse} @self
  - delay{ticks=<caster.var.fv_soulcube_t_a2_p2>}
  - skill{s=fv_soulcube_downbeam_pulse} @self
  - delay{ticks=<caster.var.fv_soulcube_t_a2_p3>}
  - skill{s=fv_soulcube_downbeam_pulse} @self

fv_soulcube_downbeam_pulse:
  Conditions:
  - variableequals{var=caster.fv_soulcube_state;value=FIGHT} true
  Skills:
  - skill{s=fv_soulcube_sfx_pulse} @self
  - skill{s=fv_soulcube_vfx_pulse} @self

fv_soulcube_downbeam_land:
  Skills:
  - skill{s=fv_soulcube_sfx_downbeam_land} @self
  - skill{s=fv_soulcube_vfx_land} @self
  - skill{s=fv_soulcube_land_check} @PlayersInRadius{r=3.2}

# Crashed on the floor, dazed. Hit it now.
fv_soulcube_downbeam_dazed:
  Skills:
  - setvariable{var=caster.fv_soulcube_mode;type=STRING;value=STAGGER}
  - skill{s=fv_soulcube_anim_dazed} @self
  - skill{s=fv_soulcube_sfx_dazed} @self
  - delay{ticks=<caster.var.fv_soulcube_t_stagger>}
  - setvariable{var=caster.fv_soulcube_mode;type=STRING;value=OPEN}
  - skill{s=fv_soulcube_play_idle} @self
  - skill{s=fv_soulcube_height_to_idle} @self
  - skill{s=fv_soulcube_after_attack} @self


# ============================================================================
#  DAMAGE
# ============================================================================
# hd = horizontal distance from the beam's centre (the boss' own spot),
# dy = feet height relative to the boss gliding 12 px above the floor.
# The values are stored on each player (target scope) and the _hit skill
# checks them with TargetConditions, so every player is judged on their own
# position. (An inline ?condition would test the boss, not the player.)
fv_soulcube_downbeam_check:
  TargetConditions:
  - gamemode{m=SURVIVAL,ADVENTURE} true
  - hasaura{auraName=fv_soulcube_if_laser} false
  Skills:
  - setvariable{var=target.fv_soulcube_hd;type=FLOAT;value=99}
  - setvariable{var=target.fv_soulcube_dy;type=FLOAT;value="(<target.l.y.double>)-(<caster.l.y.double>)"}
  - setvariable{var=target.fv_soulcube_hd;type=FLOAT;value="sqrt(((<target.l.x.double>)-(<caster.l.x.double>))^2+((<target.l.z.double>)-(<caster.l.z.double>))^2)"}
  - skill{s=fv_soulcube_downbeam_hit}

# Inside the impact ring, anywhere between the floor and the cube.
fv_soulcube_downbeam_hit:
  TargetConditions:
  - hasaura{auraName=fv_soulcube_if_laser} false
  - variableinrange{var=target.fv_soulcube_hd;value=0to0.65} true
  - variableinrange{var=target.fv_soulcube_dy;value=-1.5to3.6} true
  Skills:
  - damage{amount=14;ignoreArmor=false;ii=true;pi=true;pkb=true}
  - aura{auraName=fv_soulcube_if_laser;duration=10;maxStacks=1;refreshDuration=true}
  - skill{s=fv_soulcube_sfx_laser_hit}

fv_soulcube_land_check:
  TargetConditions:
  - gamemode{m=SURVIVAL,ADVENTURE} true
  Skills:
  - setvariable{var=target.fv_soulcube_hd;type=FLOAT;value=99}
  - setvariable{var=target.fv_soulcube_dy;type=FLOAT;value="(<target.l.y.double>)-(<caster.l.y.double>)"}
  - setvariable{var=target.fv_soulcube_hd;type=FLOAT;value="sqrt(((<target.l.x.double>)-(<caster.l.x.double>))^2+((<target.l.z.double>)-(<caster.l.z.double>))^2)"}
  - skill{s=fv_soulcube_land_hit}

fv_soulcube_land_hit:
  TargetConditions:
  - variableinrange{var=target.fv_soulcube_hd;value=0to2.5} true
  - variableinrange{var=target.fv_soulcube_dy;value=-1.5to0.8} true
  Skills:
  - damage{amount=6;ignoreArmor=false;ii=true;pi=true;pkb=true}
  - throw{velocity=7;velocityY=3}
  - skill{s=fv_soulcube_sfx_body_hit}
