# ============================================================================
#  FischVogel's End Boss - Core
# ============================================================================
#  The block, waking up, the fight loop, phases, damage rules, movement and
#  death. The three attacks live in their own files:
#     fv_endboss_laser.yml      attack1  - 4 laser patterns
#     fv_endboss_flight.yml     attack2  - 4 flight patterns
#     fv_endboss_shooting.yml   shooting - 5 projectile patterns
#     fv_endboss_fx.yml         every sound / particle cue
#
#  ---- TUNING CHEAT SHEET -------------------------------------------------
#   Boss health ............. Health: in mobs/fv_endboss_mobs.yml
#   Block respawn time ...... fv_eb_block_settings (seconds, -1 = one-time)
#   Arena radius ............ fv_eb_boss_settings (the flight never leaves it)
#   Phase thresholds ........ fv_eb_check_phase (66% / 33% health)
#   Speed per phase ......... speed= on the state{} lines in fv_eb_anim_*
#   Idle time per phase ..... fv_eb_t_idle / fv_eb_t_idle_rand in the
#                             PHASE TABLES below (ticks, 20 = 1 second)
#   Crash-landing window .... fv_eb_t_stagger in the PHASE TABLES
#   Damage taken while it
#     attacks / is stunned .. fv_eb_on_damaged (x0.5 / x1.35)
#   Attack damage ........... the damage{} lines, one per hit type:
#                               laser 14 ........ fv_eb_beam_hit
#                               dash 12 ......... fv_eb_dash_hit
#                               under boss 10 ... fv_eb_under_hit
#                               shockwave 8 ..... fv_eb_pulse_hit
#                               projectile 9+4 .. fv_eb_proj_hit / _splash
#                               burning trail 4 . fv_eb_scorch_hit
#                               landing 6 ....... fv_eb_land_hit
#                               phase roar 6 .... fv_eb_roar_hit
#   Which attacks a phase
#     may pick .............. fv_eb_type_* lists below
#
#  ---- HOW THE FIGHT FLOWS ------------------------------------------------
#   block clicked -> boss summoned in the same spot -> on_spawn (7 s,
#   cannot be damaged) -> LOOP:
#      idle (open for hits) -> pick an attack type that is NOT the same as
#      last time (laser / flight / shooting) -> random pattern of that type
#      -> recover -> LOOP
#   Health 66% / 33%: phase 2 / phase 3. The change happens right away, the
#   roar + shockwave plays as soon as the current attack is finished.
#   Phase 3: after a shooting attack it may chain straight into the next
#   attack without idling.
#
#  ---- DAMAGE RULES (fv_eb_on_damaged) ------------------------------------
#   WAKING   no damage (on_spawn is playing)
#   IMMUNE   no damage (flying 4 blocks up during attack2, phase roar)
#   ARMORED  x0.5  while a laser beam is live
#   OPEN     x1    idle, wind-ups, shooting
#   STAGGER  x1.35 dazed on the floor after the flight attack crash-lands
#
#  ---- HEIGHT ---------------------------------------------------------------
#   All heights are in model pixels (16 px = 1 block) above the floor the
#   block sat on (fv_eb_hpx). Between attacks the boss hovers at 16 px.
#   The frame corners hang up to 9 px below the model's origin in attack1,
#   8 px in damage / shooting and 6 px when attack2 lands, so the boss never
#   goes lower than that while those play - otherwise the frame sinks into
#   the floor:  idle 16 | low laser 9 | landed / dazed 8 | flying 0 (attack2
#   lifts the cube 4 blocks itself).
#   Moves are done in exact pixel steps by fv_eb_height_step, so the height
#   can never drift over a long fight. Use a flat arena floor.
# ============================================================================


# ============================================================================
#  PHASE TABLES
# ============================================================================
#  Every attack animation runs faster in later phases (speed 1.0 / 1.1 /
#  1.2, set on the state{} lines in fv_eb_anim_*). The tick numbers below
#  are the animation's own key moments divided by that speed, so sounds,
#  damage and the visuals stay in sync:
#     attack1   beam on 50, beam off 231, settled 252
#     attack2   thruster on 50, shockwaves 67 / 87 / 107, thruster off 147,
#               descent 180, landed 201 (the dazed animation takes over
#               right there, 2 ticks before attack2 would end at 203)
#     shooting  50 ticks; a shot is fired the moment it (re)starts and idle
#               takes over 6 ticks before it ends
#  If you change a speed= value, redo the division for that phase.
# ============================================================================
fv_eb_phase_1:
  Skills:
  - setvariable{var=caster.fv_eb_phase;type=INTEGER;value=1}
  # idle between attacks: t_idle + random(0 .. t_idle_rand) ticks
  - setvariable{var=caster.fv_eb_t_idle;type=INTEGER;value=50}
  - setvariable{var=caster.fv_eb_t_idle_rand;type=INTEGER;value=20}
  # dazed on the floor after the flight attack lands
  - setvariable{var=caster.fv_eb_t_stagger;type=INTEGER;value=60}
  # attack1 (laser): lock = beam on - 8 (the warning ping), dur = beam live, rec = recoil
  - setvariable{var=caster.fv_eb_t_a1_lock;type=INTEGER;value=42}
  - setvariable{var=caster.fv_eb_t_a1_dur;type=INTEGER;value=181}
  - setvariable{var=caster.fv_eb_t_a1_rec;type=INTEGER;value=21}
  # attack2 (flight): ignition, flight time, shockwave gaps, hover, descent
  - setvariable{var=caster.fv_eb_t_a2_ign;type=INTEGER;value=50}
  - setvariable{var=caster.fv_eb_t_a2_fly;type=INTEGER;value=97}
  - setvariable{var=caster.fv_eb_t_a2_p1;type=INTEGER;value=17}
  - setvariable{var=caster.fv_eb_t_a2_p2;type=INTEGER;value=20}
  - setvariable{var=caster.fv_eb_t_a2_p3;type=INTEGER;value=20}
  - setvariable{var=caster.fv_eb_t_a2_hover;type=INTEGER;value=33}
  - setvariable{var=caster.fv_eb_t_a2_desc;type=INTEGER;value=21}
  # shooting animation: from the last shot until idle takes over
  - setvariable{var=caster.fv_eb_t_sh_settle;type=INTEGER;value=44}
  # laser pattern settings
  - setvariable{var=caster.fv_eb_flick_every;type=INTEGER;value=99999}
  - setvariable{var=caster.fv_eb_chaos_lo;type=INTEGER;value=4}
  - setvariable{var=caster.fv_eb_chaos_hi;type=INTEGER;value=6}
  - setvariable{var=caster.fv_eb_chaos_min;type=INTEGER;value=30}
  - setvariable{var=caster.fv_eb_chaos_max;type=INTEGER;value=46}
  # shooting pattern settings (n_ = number of shots / volleys, t_ = ticks)
  #   aimed: tracking time before each shot, then ping -> shot after t_aimed_lock
  #   burst: v_burst = burst shot speed in blocks per tick (lead aiming)
  - setvariable{var=caster.fv_eb_n_aimed;type=INTEGER;value=2}
  - setvariable{var=caster.fv_eb_t_aimed_gap;type=INTEGER;value=18}
  - setvariable{var=caster.fv_eb_t_aimed_lock;type=INTEGER;value=9}
  - setvariable{var=caster.fv_eb_n_burst;type=INTEGER;value=6}
  - setvariable{var=caster.fv_eb_t_burst_gap;type=INTEGER;value=7}
  - setvariable{var=caster.fv_eb_v_burst;type=FLOAT;value=0.7}
  - setvariable{var=caster.fv_eb_n_ring;type=INTEGER;value=12}
  - setvariable{var=caster.fv_eb_n_fan;type=INTEGER;value=2}
  - setvariable{var=caster.fv_eb_t_fan_gap;type=INTEGER;value=16}
  - setvariable{var=caster.fv_eb_n_spiral;type=INTEGER;value=20}
  # flight pattern settings
  - setvariable{var=caster.fv_eb_n_dash_aim;type=INTEGER;value=10}
  - setvariable{var=caster.fv_eb_n_dash_go;type=INTEGER;value=16}
  - setvariable{var=caster.fv_eb_n_dash_brake;type=INTEGER;value=4}

