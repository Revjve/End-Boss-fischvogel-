  Skills:
  - setvariable{var=caster.fv_eb_phase;type=INTEGER;value=2}
  - setvariable{var=caster.fv_eb_t_idle;type=INTEGER;value=34}
  - setvariable{var=caster.fv_eb_t_idle_rand;type=INTEGER;value=16}
