# A faint trail behind every shot.
fv_eb_proj_tick:
  Skills:
  - particles{particle=dust;color=#9FFCFF;size=0.9;amount=1;hs=0.06;vs=0.06;speed=0} @origin

fv_eb_proj_hit:
  TargetConditions:
  - gamemode{m=SURVIVAL,ADVENTURE} true
  Skills:
  - damage{amount=9;ignoreArmor=false;ii=true;pi=true;pkb=true}
  - aura{auraName=fv_eb_if_proj;duration=10;maxStacks=1;refreshDuration=true}
  - skill{s=fv_eb_sfx_proj_hit}

# Wherever a shot ends (player, wall, out of range): it bursts.
fv_eb_proj_end:
  Skills:
  - summon{type=fv_endboss_burst;amount=1;radius=0} @origin
  - skill{s=fv_eb_sfx_proj_burst} @origin
  - particles{particle=dust;color=#BFFFFF;size=1.1;amount=6;hs=0.35;vs=0.35;speed=0} @origin
  - skill{s=fv_eb_proj_splash} @PlayersNearOrigin{r=1.6}

fv_eb_proj_splash:
  TargetConditions:
  - gamemode{m=SURVIVAL,ADVENTURE} true
  - hasaura{auraName=fv_eb_if_proj} false
  Skills:
  - damage{amount=4;ignoreArmor=false;ii=true;pi=true;pkb=true}
  - aura{auraName=fv_eb_if_proj;duration=10;maxStacks=1;refreshDuration=true}
