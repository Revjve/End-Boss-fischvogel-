# ============================================================================
#  FischVogel's End Boss - Mobs
# ============================================================================
#  fv_endboss_dormant   THE BLOCK. Spawn this one, once, where the fight
#                       should happen. It sits on the ground like a normal
#                       block, cannot be hurt, and wakes up when a player
#                       left- or right-clicks it. While the fight runs it
#                       hides; after the boss dies it re-forms on its own
#                       (respawn timer in fv_endboss_core.yml), and after a
#                       reset or a server restart it comes back at once.
#                       It is persistent - place it one time and forget it.
#
#  fv_endboss           THE BOSS. Never spawn it by hand - the block summons
#                       it in exactly its own spot and pose, so the block
#                       turns into the boss without a visible swap.
#
#  everything else      invisible effect carriers (projectile, explosion,
#                       death effects). Not real mobs.
#
#  Both the block and the boss stand on an invisible SLIME of size 2, whose
#  vanilla hitbox is 1.04 x 1.04 blocks - the size of the cube. ModelEngine
#  uses that hitbox as-is (hitbox=false on the model), so nothing in the
#  blueprint had to be added for it. A slime has no armour, no undead / arthropod
#  bonus damage, no AI side effects with NoAI, and never splits
#  (PreventSlimeSplit). Note: like every hostile mob, slimes are removed on
#  Peaceful difficulty, so do not run this boss on Peaceful.
#
#  Invisible: true matters: ModelEngine hides the slime while a model is on
#  it, but the boss hands its model to the death effect the moment it dies
#  and the block takes its model off when it wakes up - without the
#  invisibility a green slime would flash up in both moments.
#
#  Blueprints (plugins/ModelEngine/blueprints/):
#     fv_endboss.bbmodel             dormant, on_spawn, idle, attack1, attack2,
#                                    shooting, damage, eyes, death
#     fv_endboss_projectile.bbmodel  idle, explosion
# ============================================================================


# ============================================================================
#  THE BLOCK
# ============================================================================
fv_endboss_dormant:
  Type: SLIME
  Display: ''
  Health: 100
  Damage: 0
  Armor: 0
  Options:
    Size: 2
    PreventSlimeSplit: true
    Invisible: true
    NoAI: true
    NoGravity: true
    Silent: true
    Collidable: false
    KnockbackResistance: 1
    Despawn: false
    Persistent: true
    AlwaysShowName: false
    ShowHealth: false
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventItemPickup: true
    PreventRenaming: true
    PreventLeashing: true
  AIGoalSelectors:
  - clear
  AITargetSelectors:
  - clear
  Skills:
  # put the model on, snap to the block grid rotation, get ready
  - skill{s=fv_eb_block_spawn} @self ~onSpawn
  # after a restart / chunk reload: if a fight was running, come back now
  - skill{s=fv_eb_block_load} @self ~onLoad
  # left click arrives as damage, right click as interact. Both are
  # cancelled (sync=true is required for cancelevent) and both wake it up.
  - skill{s=fv_eb_block_hit;sync=true} @self ~onDamaged
  - skill{s=fv_eb_block_click;sync=true} @self ~onInteract
  # creepy ambience, the occasional peek, respawn countdown, boss watchdog
  - skill{s=fv_eb_block_second} @self ~onTimer:20
  # the boss reports back
  - skill{s=fv_eb_block_on_defeat} @self ~onSignal:FV_EB_DEFEATED
  - skill{s=fv_eb_block_restore} @self ~onSignal:FV_EB_RESET


# ============================================================================
#  THE BOSS
# ============================================================================
#  Health is the single biggest difficulty knob. 750 is tuned for one to
#  three well geared players; add ~250 per extra player you expect.
#
#  BossBar color BLUE is used on purpose: no vanilla boss uses it, so when the
#  custom boss bar texture is made later it can simply replace the blue bar
#  sprites without touching the Ender Dragon / Wither / raid bars.
# ============================================================================
fv_endboss:
  Type: SLIME
  Display: '<gradient:#9ffcff:#ffffff>Soul Cube</gradient>'
  Health: 750
  Damage: 0
  Armor: 0
  BossBar:
    Enabled: true
    Title: '<gradient:#9ffcff:#ffffff>Soul Cube</gradient>'
    Range: 48
    Color: BLUE
    Style: SEGMENTED_10
    CreateFog: false
    DarkenSky: true
    PlayMusic: false
  Options:
    Size: 2
    PreventSlimeSplit: true
    Invisible: true
    NoAI: true
    NoGravity: true
    Silent: true
    Collidable: false
    KnockbackResistance: 1
    # CHUNK: if everybody leaves and the chunk unloads, the boss is gone and
    # the block re-forms on its next load. The boss itself is never saved.
    Despawn: CHUNK
    Persistent: false
    AlwaysShowName: false
    ShowHealth: false
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventItemPickup: true
    PreventRenaming: true
    PreventLeashing: true
  DamageModifiers:
  - FALL 0
  - SUFFOCATION 0
  - DROWNING 0
  - FIRE 0
  - FIRE_TICK 0
  - LAVA 0
  - POISON 0
  - WITHER 0.5
  - BLOCK_EXPLOSION 0.5
  - ENTITY_EXPLOSION 0.5
  AIGoalSelectors:
  - clear
  AITargetSelectors:
  - clear
  Drops:
  - exp 1500
  Skills:
  - skill{s=fv_eb_boss_spawn} @self ~onSpawn
  - skill{s=fv_eb_on_damaged;sync=true} @self ~onDamaged
  - skill{s=fv_eb_on_interact;sync=true} @self ~onInteract
  # turns to face the closest player while it is not attacking
  - skill{s=fv_eb_watch} @self ~onTimer:2
  # watchdog, leash, "everyone left" reset, link to the block
  - skill{s=fv_eb_boss_second} @self ~onTimer:20
  - skill{s=fv_eb_on_death} @self ~onDeath


# ============================================================================
#  EFFECT CARRIERS - invisible marker armour stands, never real mobs
# ============================================================================
#  Despawn: CHUNK cleans them up on chunk unload, the ~onTimer:200 removal is
#  a last safety net. Every effect here ends well inside 200 ticks.
#  If your ModelEngine build refuses to render models on marker armour
#  stands, set Marker: false - nothing here relies on them being markers.
# ============================================================================
fv_endboss_fx_base:
  Type: ARMOR_STAND
  Display: ''
  Health: 1
  Damage: 0
  Options:
    Despawn: CHUNK
    Invisible: true
    Marker: true
    Small: false
    HasArms: false
    HasBasePlate: false
    NoAI: true
    NoGravity: true
    Collidable: false
    Invincible: true
    Silent: true
    Persistent: false
    AlwaysShowName: false
    ShowHealth: false
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventItemPickup: true
    PreventRenaming: true
    PreventLeashing: true
  Skills:
  - remove @self ~onTimer:200

# The flying projectile. MythicMobs moves this along the projectile path
# (bulletType=MOB in fv_endboss_shooting.yml) and removes it when the
# projectile ends. "idle" is the spinning star; it MUST be playing at all
# times, because the projectile's rest pose shows its explosion shards.
fv_endboss_bullet:
  Template: fv_endboss_fx_base
  Skills:
  - model{mid=fv_endboss_projectile;usm=true;hitbox=false;showshadow=false;radius=64;initrender=false} @self ~onSpawn
  - bodyrotation{mid=fv_endboss_projectile;playermode=true;stable=0;rdelay=0;rduration=0} @self ~onSpawn
  - brightness{mid=fv_endboss_projectile;b=15;s=15} @self ~onSpawn
  - state{mid=fv_endboss_projectile;s=idle;p=10;li=0;lo=0;force=true} @self ~onSpawn
  - renderinit{mid=fv_endboss_projectile} @self ~onSpawn

# Spawned where a projectile ends: plays the "explosion" animation (flash,
# shards fly out - it is finished after ~0.25 s) and removes itself.
fv_endboss_burst:
  Template: fv_endboss_fx_base
  Skills:
  - model{mid=fv_endboss_projectile;usm=true;hitbox=false;showshadow=false;radius=64;initrender=false} @self ~onSpawn
  - defaultstate{mid=fv_endboss_projectile;type=IDLE;state=blank;li=0;lo=0} @self ~onSpawn
  - brightness{mid=fv_endboss_projectile;b=15;s=15} @self ~onSpawn
  - state{mid=fv_endboss_projectile;s=explosion;p=10;li=0;lo=0;force=true} @self ~onSpawn
  - renderinit{mid=fv_endboss_projectile} @self ~onSpawn
  - remove{delay=14} @self ~onSpawn

# Death director. When the boss dies, its model is moved onto this carrier,
# which plays the "death" animation and every sound / particle that belongs
# to it, independent of how long the dead slime itself stays around.
fv_endboss_deathfx:
  Template: fv_endboss_fx_base
  Skills:
  - skill{s=fv_eb_death_start} @self ~onSpawn
