  - setvariable{var=caster.fv_endsoul_state;type=STRING;value=RESET}
  - skill{s=fv_endsoul_abort} @self
  - skill{s=fv_endsoul_sfx_reset} @self
  - skill{s=fv_endsoul_link_reset} @MobsInRadius{types=fv_endsoul_block;r=48}
  - remove{delay=4} @self

