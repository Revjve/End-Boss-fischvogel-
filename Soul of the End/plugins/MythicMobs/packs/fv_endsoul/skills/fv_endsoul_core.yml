fv_endsoul_height_start:
  Skills:
  - skill{s=fv_endsoul_height_step} @self ?!variableisset{var=caster.fv_endsoul_hmoving}

fv_endsoul_height_step:
  Skills:
  - setvariable{var=caster.fv_endsoul_hmoving;type=INTEGER;value=1;duration=3}
  - setvariable{var=skill.d;type=INTEGER;value="<caster.var.fv_endsoul_hpx_target>-<caster.var.fv_endsoul_hpx>"}
  - skill{s=fv_endsoul_h_up2} @self ?variableinrange{var=skill.d;value=2to99999}
  - skill{s=fv_endsoul_h_up1} @self ?variableequals{var=skill.d;value=1}
  - skill{s=fv_endsoul_h_down1} @self ?variableequals{var=skill.d;value=-1}
  - skill{s=fv_endsoul_h_down2} @self ?variableinrange{var=skill.d;value=-99999to-2}
  - skill{s=fv_endsoul_height_step;delay=1} @self ?!variableequals{var=skill.d;value=0}
  - variableunset{var=caster.fv_endsoul_hmoving} ?variableequals{var=skill.d;value=0}

