# Made by revjve

fv_endsoul_downbeam:
  Skills:
  - setvariable{var=skill.ep;type=INTEGER;value=<caster.var.fv_endsoul_epoch>}
  - setvariable{var=caster.fv_endsoul_lasttype;type=STRING;value=DOWNBEAM}
  - setvariable{var=caster.fv_endsoul_mode;type=STRING;value=OPEN}
  - setvariable{var=caster.fv_endsoul_alive;type=INTEGER;value=1;duration=440}
  - setvariable{var=caster.fv_endsoul_db_n;type=INTEGER;value=0}
  - skill{s=fv_endsoul_anim_attack2} @self
  - skill{s=fv_endsoul_sfx_downbeam_rise} @self
  - skill{s=fv_endsoul_height_to_beam} @self
  - setvariable{var=skill.wait;type=INTEGER;value="max(1,(<caster.var.fv_endsoul_t_a2_ign>)-8)"}
  - delay 8
  - cancelskill ?!variableequals{var=caster.fv_endsoul_epoch;value=<skill.var.ep>}
  - skill{s=fv_endsoul_downbeam_telegraph} @self
  - delay{ticks=<skill.var.wait>}
  - cancelskill ?!variableequals{var=caster.fv_endsoul_epoch;value=<skill.var.ep>}
  - setvariable{var=caster.fv_endsoul_mode;type=STRING;value=ARMORED}
  - skill{s=fv_endsoul_sfx_downbeam_ignite} @self
  - setvariable{var=caster.fv_endsoul_db_n;type=INTEGER;value=<caster.var.fv_endsoul_t_a2_beam>}
  - skill{s=fv_endsoul_db_to_lock} @self
  - skill{s=fv_endsoul_downbeam_tick} @self
  - skill{s=fv_endsoul_downbeam_pulses} @self
  - delay{ticks=<caster.var.fv_endsoul_t_a2_beam>}
  - cancelskill ?!variableequals{var=caster.fv_endsoul_epoch;value=<skill.var.ep>}
  - setvariable{var=caster.fv_endsoul_db_n;type=INTEGER;value=0}
  - skill{s=fv_endsoul_sfx_downbeam_off} @self
  - delay{ticks=<caster.var.fv_endsoul_t_a2_hover>}
  - cancelskill ?!variableequals{var=caster.fv_endsoul_epoch;value=<skill.var.ep>}
  - skill{s=fv_endsoul_height_to_landed} @self
  - skill{s=fv_endsoul_sfx_downbeam_descend} @self
  - delay{ticks=<caster.var.fv_endsoul_t_a2_desc>}
  - cancelskill ?!variableequals{var=caster.fv_endsoul_epoch;value=<skill.var.ep>}
  - skill{s=fv_endsoul_downbeam_land} @self
  - skill{s=fv_endsoul_downbeam_dazed} @self

fv_endsoul_downbeam_telegraph:
  Skills:
  - skill{s=fv_endsoul_sfx_downbeam_charge} @self
  - skill{s=fv_endsoul_vfx_downbeam_mark} @self

fv_endsoul_downbeam_tick:
  Conditions:
  - variableinrange{var=caster.fv_endsoul_db_n;value=1to99999} true
  - variableequals{var=caster.fv_endsoul_state;value=FIGHT} true
  Skills:
  - variableadd{var=caster.fv_endsoul_db_n;amount=-1}
  - variableadd{var=caster.fv_endsoul_db_k;amount=-1}
  - setvariable{var=skill.st;type=STRING;value=<caster.var.fv_endsoul_db_stage>}
  - skill{s=fv_endsoul_db_lock_tick} @self ?variableequals{var=skill.st;value=LOCK}
  - skill{s=fv_endsoul_db_dash_tick} @self ?variableequals{var=skill.st;value=DASH}
  - skill{s=fv_endsoul_db_next} @self ?variableinrange{var=caster.fv_endsoul_db_k;value=-99999to0}
  - skill{s=fv_endsoul_downbeam_check} @PlayersInRadius{r=6}
  - skill{s=fv_endsoul_vfx_downbeam} @self
  - skill{s=fv_endsoul_sfx_downbeam_roar} @self
  - skill{s=fv_endsoul_downbeam_tick;delay=1} @self

fv_endsoul_db_next:
  Skills:
  - setvariable{var=skill.st;type=STRING;value=<caster.var.fv_endsoul_db_stage>}
  - skill{s=fv_endsoul_db_to_dash} @self ?variableequals{var=skill.st;value=LOCK}
  - skill{s=fv_endsoul_db_to_rest} @self ?variableequals{var=skill.st;value=DASH}
  - skill{s=fv_endsoul_db_to_lock} @self ?variableequals{var=skill.st;value=REST}

fv_endsoul_db_to_lock:
  Skills:
  - setvariable{var=caster.fv_endsoul_db_stage;type=STRING;value=LOCK}
  - setvariable{var=caster.fv_endsoul_db_k;type=INTEGER;value=<caster.var.fv_endsoul_t_db_lock>}

fv_endsoul_db_to_dash:
  Skills:
  - setvariable{var=caster.fv_endsoul_db_stage;type=STRING;value=DASH}
  - setvariable{var=caster.fv_endsoul_db_k;type=INTEGER;value=12}
  - skill{s=fv_endsoul_sfx_downbeam_dash} @self

fv_endsoul_db_to_rest:
  Skills:
  - setvariable{var=caster.fv_endsoul_db_stage;type=STRING;value=REST}
  - setvariable{var=caster.fv_endsoul_db_k;type=INTEGER;value=<caster.var.fv_endsoul_t_db_rest>}

fv_endsoul_db_lock_tick:
  Skills:
  - setvariable{var=skill.track;type=FLOAT;value="(<caster.var.fv_endsoul_db_k>)>(<caster.var.fv_endsoul_t_db_freeze>)"}
  - rotatetowards{maxyaw=30} @NearestPlayer{r=48} ?variableinrange{var=skill.track;value=0.5to2}
  - skill{s=fv_endsoul_vfx_dash_aim} @self ?variableinrange{var=skill.track;value=0.5to2}
  - skill{s=fv_endsoul_vfx_dash_locked} @self ?variableinrange{var=skill.track;value=-1to0.5}
  - setvariable{var=skill.click;type=FLOAT;value="(<caster.var.fv_endsoul_db_k>)==(<caster.var.fv_endsoul_t_db_freeze>)"}
  - skill{s=fv_endsoul_sfx_dash_locked} @self ?variableinrange{var=skill.click;value=0.5to2}

fv_endsoul_db_dash_tick:
  Skills:
  - setvariable{var=skill.k;type=INTEGER;value=<caster.var.fv_endsoul_db_k>}
  - teleport{unsafe=true;preserveyaw=true} @Forward{f=0.4;lockpitch=true;uel=false} ?variableequals{var=skill.k;value=11}
  - teleport{unsafe=true;preserveyaw=true} @Forward{f=0.75;lockpitch=true;uel=false} ?variableequals{var=skill.k;value=10}
  - teleport{unsafe=true;preserveyaw=true} @Forward{f=1;lockpitch=true;uel=false} ?variableinrange{var=skill.k;value=2to9}
  - teleport{unsafe=true;preserveyaw=true} @Forward{f=0.6;lockpitch=true;uel=false} ?variableequals{var=skill.k;value=1}
  - teleport{unsafe=true;preserveyaw=true} @Forward{f=0.3;lockpitch=true;uel=false} ?variableequals{var=skill.k;value=0}
  - skill{s=fv_endsoul_vfx_dash_trail} @self
  - setvariable{var=skill.away;type=FLOAT;value="sqrt(((<caster.l.x.double>)-(<caster.var.fv_endsoul_home_x>))^2+((<caster.l.z.double>)-(<caster.var.fv_endsoul_home_z>))^2)"}
  - setvariable{var=skill.out;type=FLOAT;value="(<skill.var.away>)>(<caster.var.fv_endsoul_arena_r>)"}
  - setvariable{var=caster.fv_endsoul_db_k;type=INTEGER;value=0} ?variableinrange{var=skill.out;value=0.5to2}

fv_endsoul_downbeam_pulses:
  Skills:
  - setvariable{var=skill.ep;type=INTEGER;value=<caster.var.fv_endsoul_epoch>}
  - delay{ticks=<caster.var.fv_endsoul_t_a2_p1>}
  - cancelskill ?!variableequals{var=caster.fv_endsoul_epoch;value=<skill.var.ep>}
  - skill{s=fv_endsoul_downbeam_pulse} @self
  - delay{ticks=<caster.var.fv_endsoul_t_a2_p2>}
  - cancelskill ?!variableequals{var=caster.fv_endsoul_epoch;value=<skill.var.ep>}
  - skill{s=fv_endsoul_downbeam_pulse} @self
  - delay{ticks=<caster.var.fv_endsoul_t_a2_p3>}
  - cancelskill ?!variableequals{var=caster.fv_endsoul_epoch;value=<skill.var.ep>}
  - skill{s=fv_endsoul_downbeam_pulse} @self

fv_endsoul_downbeam_pulse:
  Conditions:
  - variableequals{var=caster.fv_endsoul_state;value=FIGHT} true
  Skills:
  - skill{s=fv_endsoul_sfx_pulse} @self
  - skill{s=fv_endsoul_vfx_pulse} @self

fv_endsoul_downbeam_land:
  Skills:
  - skill{s=fv_endsoul_sfx_downbeam_land} @self
  - skill{s=fv_endsoul_vfx_land} @self
  - skill{s=fv_endsoul_land_check} @PlayersInRadius{r=3.2}

fv_endsoul_downbeam_dazed:
  Skills:
  - setvariable{var=skill.ep;type=INTEGER;value=<caster.var.fv_endsoul_epoch>}
  - setvariable{var=caster.fv_endsoul_mode;type=STRING;value=STAGGER}
  - skill{s=fv_endsoul_anim_dazed} @self
  - skill{s=fv_endsoul_sfx_dazed} @self
  - delay{ticks=<caster.var.fv_endsoul_t_stagger>}
  - cancelskill ?!variableequals{var=caster.fv_endsoul_epoch;value=<skill.var.ep>}
  - setvariable{var=caster.fv_endsoul_mode;type=STRING;value=OPEN}
  - skill{s=fv_endsoul_play_idle} @self
  - skill{s=fv_endsoul_height_to_idle} @self
  - skill{s=fv_endsoul_after_attack} @self

fv_endsoul_downbeam_check:
  TargetConditions:
  - gamemode{m=SURVIVAL,ADVENTURE} true
  - hasaura{auraName=fv_endsoul_if_laser} false
  Skills:
  - skill{s=fv_endsoul_probe}
  - skill{s=fv_endsoul_downbeam_hit}

fv_endsoul_downbeam_hit:
  TargetConditions:
  - hasaura{auraName=fv_endsoul_if_laser} false
  - variableinrange{var=target.fv_endsoul_hd;value=0to0.8} true
  - variableinrange{var=target.fv_endsoul_dy;value=-1.5to3.6} true
  Skills:
  - damage{amount=14;ignoreArmor=false;ii=true;pi=true;pkb=true}
  - aura{auraName=fv_endsoul_if_laser;duration=10;maxStacks=1;refreshDuration=true}
  - skill{s=fv_endsoul_sfx_laser_hit}

fv_endsoul_land_check:
  TargetConditions:
  - gamemode{m=SURVIVAL,ADVENTURE} true
  Skills:
  - skill{s=fv_endsoul_probe}
  - skill{s=fv_endsoul_land_hit}

fv_endsoul_land_hit:
  TargetConditions:
  - variableinrange{var=target.fv_endsoul_hd;value=0to2.5} true
  - variableinrange{var=target.fv_endsoul_dy;value=-1.5to0.8} true
  Skills:
  - damage{amount=6;ignoreArmor=false;ii=true;pi=true;pkb=true}
  - throw{velocity=7;velocityY=3}
  - skill{s=fv_endsoul_sfx_body_hit}
